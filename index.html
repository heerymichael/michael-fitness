<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Michael Fitness</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Michael Fitness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   MICHAEL FITNESS — design tokens
   Paper white, true black, one red. Loud condensed display type.
   ============================================================ */
:root{
  color-scheme: light;
  --paper:#FFFFFF;
  --ink:#000000;
  --red:#F60024;
  --grey:#767676;
  --rule:#E6E6E6;
  --wash:#F4F4F4;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);

  --display: 'Anton', 'Arial Narrow', 'Helvetica Neue Condensed', Impact, sans-serif;
  --body: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  --bar-h: 78px;
}

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }

html{
  height:100%;
  -webkit-text-size-adjust:100%;
  scroll-padding-top: var(--safe-t);
}
body{
  margin:0;
  height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.4;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- App frame ---------- */
#app{
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding-top:var(--safe-t);
}
.view{ display:none; flex:1 1 auto; flex-direction:column; }
.view.on{ display:flex; }

.scroll{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom: calc(var(--safe-b) + 32px);
}
#v-session .scroll{ padding-bottom: calc(var(--bar-h) + var(--safe-b) + 24px); }

/* ---------- Typography ---------- */
h1,h2,h3,h4{ margin:0; font-family:var(--display); font-weight:400; letter-spacing:.01em; line-height:.95; text-transform:uppercase; }
h1{ font-size:clamp(38px,11vw,54px); }
h2{ font-size:clamp(28px,7.5vw,38px); }
h3{ font-size:clamp(22px,6vw,28px); }
p{ margin:0 0 12px; }
.pad{ padding:0 20px; }

.kicker{
  font-family:var(--body);
  font-weight:800;
  font-size:13px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--grey);
}
.muted{ color:var(--grey); font-size:15px; }

/* ---------- Hero ---------- */
.hero{
  background:var(--ink);
  color:var(--paper);
  padding:26px 20px 24px;
}
.hero .wordmark{
  font-family:var(--display);
  font-size:clamp(40px,12.5vw,60px);
  line-height:.86;
  text-transform:uppercase;
}
.hero .wordmark em{ font-style:normal; color:var(--red); }
.hero .tag{
  margin-top:10px; font-weight:700; font-size:13px;
  letter-spacing:.18em; text-transform:uppercase; color:#9A9A9A;
}

/* ---------- Buttons ---------- */
button{ font-family:var(--body); font-size:17px; border:0; background:none; color:inherit; cursor:pointer; }

.btn-huge{
  display:block; width:100%;
  background:var(--red); color:#fff;
  font-family:var(--display); font-size:clamp(28px,8vw,38px);
  text-transform:uppercase; letter-spacing:.01em;
  padding:22px 18px; text-align:left;
  position:relative;
}
.btn-huge .sub{
  display:block; font-family:var(--body); font-size:13px; font-weight:700;
  letter-spacing:.16em; margin-bottom:6px; opacity:.85;
}
.btn-huge::after{
  content:''; position:absolute; right:20px; top:50%; width:20px; height:20px;
  border-right:4px solid #fff; border-top:4px solid #fff;
  transform:translateY(-50%) rotate(45deg);
}
.btn-huge:active{ background:#c9001d; }

.btn-block{
  display:flex; align-items:center; justify-content:space-between;
  width:100%; padding:18px 20px;
  border-top:2px solid var(--ink);
  font-family:var(--display); font-size:22px; text-transform:uppercase;
  text-align:left;
}
.btn-block:active{ background:var(--wash); }
.btn-block .meta{ font-family:var(--body); font-size:14px; font-weight:600; color:var(--grey); text-transform:none; }

.btn-ghost{
  border:2px solid var(--ink); padding:12px 16px; font-weight:700;
  font-size:15px; text-transform:uppercase; letter-spacing:.08em;
}
.btn-ghost:active{ background:var(--ink); color:#fff; }

/* ---------- Home cards ---------- */
.upnext{
  padding:22px 20px 20px;
  border-bottom:6px solid var(--ink);
}
.upnext .phase{ font-family:var(--display); font-size:clamp(30px,8.5vw,42px); text-transform:uppercase; }
.upnext .prog{ color:var(--red); }

.weekbar{ display:flex; gap:4px; margin-top:14px; }
.weekbar span{ flex:1; height:8px; background:var(--rule); }
.weekbar span.done{ background:var(--ink); }
.weekbar span.cur{ background:var(--red); }

.strip{
  display:flex; align-items:center; gap:14px;
  padding:16px 20px; border-top:2px solid var(--ink); background:var(--wash);
}
.strip .num{
  font-family:var(--display); font-size:40px; line-height:.8; color:var(--red);
}
.strip .txt{ flex:1; font-size:15px; line-height:1.25; }
.strip .txt b{ display:block; font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--grey); }

/* ---------- Session ---------- */
.sesshead{
  position:sticky; top:0; z-index:20;
  background:var(--paper); border-bottom:2px solid var(--ink);
  padding:12px 16px 10px;
}
.sesshead .row{ display:flex; align-items:center; gap:12px; }
.sesshead .title{ flex:1; font-family:var(--display); font-size:20px; text-transform:uppercase; }
.xbtn{ width:40px; height:40px; font-size:26px; line-height:1; color:var(--grey); }

.segs{ display:flex; gap:3px; margin-top:10px; }
.segs i{ flex:1; height:6px; background:var(--rule); }
.segs i.done{ background:var(--ink); }
.segs i.cur{ background:var(--red); }

.blockhead{ padding:22px 20px 4px; }
.blockhead .kicker{ color:var(--red); }
.blockhead h2{ margin-top:4px; }
.restnote{
  margin:14px 20px 0; padding:10px 14px;
  border-left:5px solid var(--ink); background:var(--wash);
  font-size:14px; font-weight:600; line-height:1.3;
}

.ex{ padding:26px 20px 4px; border-top:2px solid var(--rule); margin-top:22px; }
.ex:first-of-type{ border-top:0; }
.ex .code{
  font-family:var(--display); font-size:15px; color:#fff; background:var(--ink);
  display:inline-block; padding:3px 9px 2px; margin-bottom:8px; letter-spacing:.06em;
}
.ex h3{ color:var(--red); }
.ex .note{
  margin-top:10px; font-size:14.5px; color:#333; line-height:1.35;
  border-left:3px solid var(--rule); padding-left:12px;
}
.vidrow{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.vid{
  display:inline-flex; align-items:center; gap:8px;
  border:2px solid var(--ink); padding:9px 14px;
  font-weight:800; font-size:13px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink); text-decoration:none;
}
.vid:active{ background:var(--ink); color:#fff; }
.vid::before{
  content:''; width:0; height:0;
  border-left:11px solid currentColor; border-top:7px solid transparent; border-bottom:7px solid transparent;
}
.pb{
  margin-top:12px; font-family:var(--display); font-size:15px; letter-spacing:.06em;
  color:var(--grey);
}
.pb b{ color:var(--ink); }

/* ---------- Set rows ---------- */
.round{ padding:4px 20px 0; margin-top:26px; }
.roundhead{
  font-family:var(--display); font-size:24px; text-transform:uppercase;
  border-bottom:4px solid var(--ink); padding-bottom:5px; margin-bottom:14px;
}
.rname{
  font-weight:800; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--red); margin:0 0 6px;
}
.round .set{ margin-bottom:16px; }
.sets{ margin-top:16px; }
.set{
  border:2px solid var(--ink); margin-bottom:10px;
}
.set.done{ background:var(--ink); color:#fff; }
.set.done .target{ color:#B9B9B9; }
.set .top{ display:flex; align-items:flex-start; gap:12px; padding:13px 14px 11px; }
.set .lab{ font-family:var(--display); font-size:17px; min-width:62px; text-transform:uppercase; }
.set .lab:empty{ display:none; min-width:0; }
.set .target{ flex:1; font-size:14.5px; line-height:1.3; font-weight:500; color:#333; }
.set .entry{ display:flex; gap:8px; padding:0 14px 13px; align-items:stretch; flex-wrap:nowrap; }

.field{ display:flex; align-items:center; border:2px solid currentColor; flex:1 1 0; min-width:0; }
.field label{
  font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  padding:0 6px; opacity:.6; flex:0 0 auto; line-height:1.05; max-width:42px;
}
.field input{
  flex:1 1 0; width:100%; min-width:0; border:0; background:transparent; color:inherit;
  font-family:var(--display); font-size:26px; padding:8px 6px 6px 0; text-align:center;
  -moz-appearance:textfield;
}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.field input:focus{ outline:3px solid var(--red); outline-offset:2px; }

.donebtn{
  width:100%; border:2px solid currentColor; padding:13px;
  font-family:var(--display); font-size:22px; text-transform:uppercase; letter-spacing:.04em;
}
.donebtn.is-done{ background:var(--red); border-color:var(--red); color:#fff; }
.tick{
  flex:0 0 56px; width:56px; min-height:48px;
  border:2px solid currentColor; font-size:24px; font-weight:800; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.tick.off{ color:#C9C9C9; }
.set.done .tick{ background:var(--red); border-color:var(--red); color:#fff; }
.set.done .tick.off{ background:transparent; border-color:#555; color:#555; }

.timebtn{
  width:100%; border:2px solid currentColor; padding:14px;
  font-family:var(--display); font-size:34px; text-transform:uppercase; letter-spacing:.04em;
  display:flex; align-items:center; justify-content:space-between;
}
.timebtn.running{ background:var(--red); border-color:var(--red); color:#fff; }
.timebtn small{ font-family:var(--body); font-size:12px; font-weight:800; letter-spacing:.14em; }

/* ---------- Bottom bar ---------- */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--ink); color:#fff;
  padding-bottom:var(--safe-b);
  display:flex; align-items:stretch;
}
.bar button{
  flex:1; color:#fff; padding:20px 14px;
  font-family:var(--display); font-size:24px; text-transform:uppercase; letter-spacing:.03em;
}
.bar button.prev{ flex:0 0 78px; border-right:1px solid #333; color:#9A9A9A; font-size:18px; }
.bar button.go{ background:var(--red); }
.bar button:active{ opacity:.8; }

/* ---------- Rest overlay ---------- */
.overlay{
  position:fixed; inset:0; z-index:90; background:var(--ink); color:#fff;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding: calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);
  text-align:center;
}
.overlay.on{ display:flex; }
.overlay .kicker{ color:#8A8A8A; }
.overlay .clock{
  font-family:var(--display); font-size:clamp(90px,34vw,180px); line-height:.85; margin:14px 0 6px;
}
.overlay .clock.zero{ color:var(--red); }
.overlay .next{ font-size:15px; color:#B9B9B9; max-width:22em; margin-bottom:28px; }
.overlay .acts{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.overlay .acts button{
  border:2px solid #fff; color:#fff; padding:13px 22px;
  font-weight:800; letter-spacing:.1em; text-transform:uppercase; font-size:14px;
}
.overlay .acts button.primary{ background:var(--red); border-color:var(--red); }

/* ---------- Workout picker ---------- */
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.chip{
  border:2px solid var(--ink); padding:12px 0; min-width:60px; flex:1 1 60px;
  font-family:var(--display); font-size:22px; text-transform:uppercase;
  background:var(--paper); color:var(--ink); text-align:center;
}
.chip.on{ background:var(--ink); color:#fff; }
.chip.on.red{ background:var(--red); border-color:var(--red); }
.picksum{
  margin-top:26px; padding:18px 20px; background:var(--wash);
  border-left:6px solid var(--red);
}
.picksum .kicker{ color:var(--grey); }
.picksum .big{ font-family:var(--display); font-size:30px; text-transform:uppercase; margin-top:4px; line-height:1; }

/* ---------- Video library ---------- */
#vidSearch{
  width:100%; margin-top:10px; padding:11px 12px;
  border:2px solid var(--ink); background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; font-weight:600;
  -webkit-appearance:none; border-radius:0;
}
#vidSearch:focus{ outline:3px solid var(--red); outline-offset:1px; }
.vgroup{ padding:22px 20px 2px; }
.vgroup .kicker{ color:var(--red); }
.vgroup h2{ margin-top:4px; }
.vrow{
  display:flex; align-items:center; gap:14px;
  padding:15px 20px; border-top:2px solid var(--rule);
  color:var(--ink); text-decoration:none;
}
.vrow:active{ background:var(--wash); }
.vrow .play{
  flex:0 0 38px; height:38px; border:2px solid var(--ink);
  display:flex; align-items:center; justify-content:center;
}
.vrow .play::before{
  content:''; width:0; height:0;
  border-left:12px solid var(--ink); border-top:8px solid transparent; border-bottom:8px solid transparent;
  margin-left:3px;
}
.vrow .vn{ flex:1; font-weight:700; font-size:16px; line-height:1.25; }
.vrow .vw{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); }

/* ---------- Lists / history ---------- */
.item{ padding:16px 20px; border-top:2px solid var(--rule); display:flex; gap:14px; align-items:baseline; }
.item .d{ font-family:var(--display); font-size:19px; min-width:74px; }
.item .b{ flex:1; }
.item .b .t{ font-weight:700; }
.item .b .s{ font-size:14px; color:var(--grey); }

.tests{ margin-top:4px; }
.test{ padding:18px 20px; border-top:2px solid var(--rule); }
.test h3{ font-size:22px; }
.test .tiers{ display:flex; gap:6px; margin:12px 0 10px; }
.test .tiers div{
  flex:1; padding:7px 4px; text-align:center; border:2px solid var(--rule);
  font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; line-height:1.25;
}
.test .tiers div b{ display:block; font-family:var(--display); font-size:14px; letter-spacing:.04em; }
.test .tiers div.hit{ background:var(--ink); color:#fff; border-color:var(--ink); }
.test .tiers div.hit.elite{ background:var(--red); border-color:var(--red); }

.grade{ font-family:var(--display); font-size:18px; text-transform:uppercase; margin-top:8px; }
.grade.poor{ color:var(--grey); }
.grade.lean{ color:var(--ink); }
.grade.elite{ color:var(--red); }

/* ---------- Settings ---------- */
.fieldrow{ padding:18px 20px; border-top:2px solid var(--rule); }
.fieldrow .kicker{ display:block; margin-bottom:8px; }
.fieldrow input, .fieldrow select{
  width:100%; border:2px solid var(--ink); padding:12px;
  font-family:var(--display); font-size:26px; background:var(--paper); color:var(--ink);
  -moz-appearance:textfield;
}
.fieldrow input::-webkit-outer-spin-button,.fieldrow input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.fieldrow select{ font-size:20px; }
.rowbtns{ display:flex; gap:10px; padding:18px 20px; flex-wrap:wrap; }

.toast{
  position:fixed; left:50%; bottom:calc(var(--bar-h) + var(--safe-b) + 18px);
  transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:#fff; padding:12px 20px;
  font-weight:700; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:120;
  white-space:nowrap;
}
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

.empty{ padding:40px 20px; text-align:center; color:var(--grey); }
.empty h3{ color:var(--ink); margin-bottom:10px; }

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}
:focus-visible{ outline:3px solid var(--red); outline-offset:2px; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section class="view on" id="v-home">
    <div class="scroll">
      <div class="hero">
        <div class="wordmark">Michael<br><em>Fitness</em></div>
        <div class="tag" id="homeTag">Lean Bastard</div>
      </div>

      <div class="upnext">
        <div class="kicker">Up next</div>
        <div class="phase" id="nowPhase">Phase 1 · Week 1</div>
        <div class="phase prog" id="nowWorkout">Workout A</div>
        <div class="weekbar" id="weekbar"></div>
      </div>

      <button class="btn-huge" id="startBtn">
        <span class="sub">Begin session</span>
        <span id="startLabel">Start Workout A</span>
      </button>

      <div class="strip" id="deltsStrip" hidden>
        <div class="num" id="deltDay">1</div>
        <div class="txt"><b>30 Days of Delts</b><span id="deltText">Today's delt work</span></div>
      </div>

      <button class="btn-block" id="toDelts">Delts<span class="meta" id="deltsMeta">Start the 30-day challenge</span></button>
      <button class="btn-block" id="toPick">Pick a workout<span class="meta">Repeat a week or jump phase</span></button>
  <button class="btn-block" id="toVideos">Videos<span class="meta" id="videosMeta"></span></button>
  <button class="btn-block" id="toStandards">Standards<span class="meta" id="standardsMeta">6 tests</span></button>
      <button class="btn-block" id="toHistory">History<span class="meta" id="historyMeta">No sessions yet</span></button>
      <button class="btn-block" id="toSettings">Settings<span class="meta" id="settingsMeta"></span></button>
    </div>
  </section>

  <!-- ============ SESSION ============ -->
  <section class="view" id="v-session">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" id="sessExit" aria-label="Leave session">&times;</button>
        <div class="title" id="sessTitle">Workout A</div>
        <button class="xbtn" id="sessFinish" aria-label="Finish session" style="font-size:15px;font-weight:800;letter-spacing:.1em;width:auto;padding:0 4px;">END</button>
      </div>
      <div class="segs" id="segs"></div>
    </div>
    <div class="scroll" id="blockWrap"></div>
    <div class="bar">
      <button class="prev" id="btnPrev">Back</button>
      <button class="go" id="btnNext">Next</button>
    </div>
  </section>

  <!-- ============ DELTS ============ -->
  <section class="view" id="v-delts">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" data-back aria-label="Back">&times;</button>
        <div class="title">30 Days of Delts</div>
      </div>
    </div>
    <div class="scroll" id="deltsWrap"></div>
  </section>

  <!-- ============ PICK A WORKOUT ============ -->
  <section class="view" id="v-pick">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" data-back aria-label="Back">&times;</button>
        <div class="title">Pick a workout</div>
      </div>
    </div>
    <div class="scroll" id="pickWrap"></div>
  </section>

  <!-- ============ VIDEOS ============ -->
  <section class="view" id="v-videos">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" data-back aria-label="Back">&times;</button>
        <div class="title">Video Library</div>
      </div>
      <input id="vidSearch" type="search" placeholder="Search exercises"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="scroll" id="videosWrap"></div>
  </section>

  <!-- ============ STANDARDS ============ -->
  <section class="view" id="v-standards">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" data-back aria-label="Back">&times;</button>
        <div class="title">Lean Bastard Standards</div>
      </div>
    </div>
    <div class="scroll" id="standardsWrap"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="view" id="v-history">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" data-back aria-label="Back">&times;</button>
        <div class="title">History</div>
      </div>
    </div>
    <div class="scroll" id="historyWrap"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section class="view" id="v-settings">
    <div class="sesshead">
      <div class="row">
        <button class="xbtn" data-back aria-label="Back">&times;</button>
        <div class="title">Settings</div>
      </div>
    </div>
    <div class="scroll" id="settingsWrap"></div>
  </section>

</div>

<!-- Rest / hold overlay -->
<div class="overlay" id="overlay">
  <div class="kicker" id="ovKicker">Rest</div>

  try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : dflt; }

}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }

/* ==================================================================
   HELPERS
   ================================================================== */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var toastTimer;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + (s<10?'0':'') + s;
}

/* bodyweight tokens: {bw:25} -> "22 kg" */
function bwText(str){
  if(str==null) return '';
  return String(str).replace(/\{bw:(\d+(?:\.\d+)?)\}/g, function(_, pct){
    if(!S.bodyweight) return pct+'% BW';
    var v = S.bodyweight * (parseFloat(pct)/100);
    return (Math.round(v*2)/2) + ' ' + S.unit;
  });
}

function phaseForWeek(prog, wk){
  for(var i=0;i<prog.phases.length;i++){ if(wk>=prog.phases[i].from && wk<=prog.phases[i].to) return prog.phases[i]; }
  return prog.phases[prog.phases.length-1];
}
function prog(){ return PROGRAMMES[S.programme] || PROGRAMMES.lean_bastard; }

/* personal bests, derived from the session log */
function bestFor(exName, kind){
  var best=null;
  for(var i=0;i<SES.length;i++){
    var e = SES[i].entries || [];
    for(var j=0;j<e.length;j++){
      if(e[j].n !== exName) continue;
      if(kind==='time' && e[j].sec!=null && (best==null || e[j].sec>best)) best=e[j].sec;
      if(kind==='reps' && e[j].reps!=null && (best==null || e[j].reps>best)) best=e[j].reps;
      if(kind==='wr' && e[j].weight!=null && (best==null || e[j].weight>best)) best=e[j].weight;
    }
  }
  return best;
}

/* ==================================================================
   GOOGLE SHEET SYNC
   The local write is the source of truth and always happens first.
   The upload is best-effort: anything that fails sits in the outbox
   and goes up next time the app is opened with a signal.
   ================================================================== */
var syncing = false;

function queueUpload(session){
  OUT.push(session);
  save(K.out, OUT);
  flushOutbox();
}

function flushOutbox(){
  if(syncing || !OUT.length || !S.syncUrl) return;
  syncing = true;

  var next = OUT[0];
  // Apps Script does not answer CORS preflight, so send this as plain
  // text. The body is still JSON and the script still parses it as JSON.
  fetch(S.syncUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: S.syncToken || '', session: next })
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    syncing = false;
    if(res && res.ok){
      OUT.shift(); save(K.out, OUT);
      updateSyncLine();
      if(OUT.length) flushOutbox();     // keep going
    } else {
      updateSyncLine(res && res.error ? res.error : 'rejected');
    }
  })
  .catch(function(){
    syncing = false;
    updateSyncLine();                   // no signal: try again later
  });
}

function syncStatus(){
  if(!S.syncUrl) return 'Not connected';
  if(OUT.length) return OUT.length + ' session' + (OUT.length>1?'s':'') + ' waiting to upload';
  return 'All sessions backed up';
}
function updateSyncLine(err){
  var n = document.getElementById('syncLine');
  if(n) n.textContent = err ? ('Last attempt failed: ' + err) : syncStatus();
}

/* Pull everything back from the Sheet. Used on a new phone. */
function restoreFromSheet(btn){
  if(!S.syncUrl){ toast('Add the Sheet URL first'); return; }
  btn.textContent = 'Restoring...';
  var url = S.syncUrl + (S.syncUrl.indexOf('?')>-1?'&':'?') +
            'token=' + encodeURIComponent(S.syncToken || '');
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res || !res.ok) throw new Error(res && res.error ? res.error : 'bad response');
      var have = {};
      SES.forEach(function(s){ have[String(s.id)] = true; });
      var added = 0;
      (res.sessions||[]).forEach(function(s){
        if(have[String(s.id)]) return;      // never duplicate
        SES.push(s); added++;
      });
      SES.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
      save(K.ses, SES);
      btn.textContent = 'Restore from Sheet';
      renderHome();
      toast(added ? (added + ' session' + (added>1?'s':'') + ' restored') : 'Nothing new to restore');
    })
    .catch(function(e){
      btn.textContent = 'Restore from Sheet';
      toast('Could not reach the Sheet');
    });
}

/* ---------- wake lock ---------- */
var wakeLock=null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock=null; });
    }
  }catch(e){ /* not supported, or denied — nothing to do */ }
}
document.addEventListener('click', keepAwake, {passive:true});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible'){ keepAwake(); refreshRunningClocks(); flushOutbox(); }
});

/* ---------- beep ---------- */
function beep(){
  try{
    var C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    var ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type='square'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.45);
    o.start(); o.stop(ctx.currentTime+.5);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}

/* ==================================================================
   SESSION
   ================================================================== */
function buildSession(letter, week, adhoc){
  week = week || S.week;
  var p = prog(), ph = phaseForWeek(p, week);
  var blocks = [];

  // warm-up as one screen: every item is a single tap to confirm
  blocks.push({ t:'Warm-up', rest:'Do this before every workout', restSec:0, warm:true,
    ex: ph.warmup.map(function(x){
      return { c:x.c, n:x.n, v:x.v, note:x.note,
               sets:[{ l:'', t:(x.sets||[]).map(function(s){ return s.t; }).join(' · '), k:'check' }] };
    }) });

  // delts: press hold opens the session
  var d = deltsToday();
  if(d && d.isLift && d.work.length){
    blocks.push({ t:'Delts · Before you lift', rest:'Two extra minutes. Added to whatever you are running.', restSec:0, delt:'start',
      ex:[{c:'D', n:d.work[0].n, note:d.work[0].t, sets:[{l:'Hold', t:'As long as possible', k:'time'}], deltId:d.work[0].id}] });
  }

  var w = ph.workouts[letter] || [];
  for(var i=0;i<w.length;i++) blocks.push(w[i]);

  // delts: lateral hold closes it
  if(d && d.isLift && d.work.length>1){
    var tail = d.work.slice(1).map(function(x){
      return {c:'D', n:x.n, note:x.t, sets:[{l: x.k==='time'?'Hold':'Reps', t: x.k==='time'?'As long as possible':'Max reps, partials included', k:x.k}], deltId:x.id};
    });
    blocks.push({ t:'Delts · Finisher', rest:'Last thing you do today.', restSec:0, delt:'end', ex:tail });
  }

  return {
    programme:S.programme, workout:letter, week:week, phase:ph.n,
    adhoc: !!adhoc,          // a one-off does not move the programme on
    startedAt:new Date().toISOString(), i:0, blocks:blocks, data:{}
  };
}

function syncDelts(){
  if(!ACT) return;
  var has = ACT.blocks.some(function(b){ return b.delt; });
  var d = deltsToday();
  if(!d || !d.isLift || !d.work.length || has) return;
  var fresh = buildSession(ACT.workout, ACT.week, ACT.adhoc);
  var open = fresh.blocks.filter(function(b){ return b.delt === 'start'; });
  var close = fresh.blocks.filter(function(b){ return b.delt === 'end'; });
  ACT.blocks.splice(1, 0, open[0]);          // straight after the warm-up
  if(ACT.i >= 1) ACT.i++;                     // keep him where he was
  if(close[0]) ACT.blocks.push(close[0]);
  save(K.act, ACT);
}

function startSession(letter, week, adhoc){
  ACT = buildSession(letter, week, adhoc);
  save(K.act, ACT);
  keepAwake();
  show('session');
  renderBlock();
}

function renderBlock(){
  if(!ACT) return show('home');
  var b = ACT.blocks[ACT.i];
  var p = prog(), ph = phaseForWeek(p, ACT.week);
  $('sessTitle').textContent = 'Workout ' + ACT.workout + ' · Wk ' + ACT.week;

  var segs = $('segs'); segs.innerHTML='';
  for(var i=0;i<ACT.blocks.length;i++){
    var s = el('i'); if(i<ACT.i) s.className='done'; if(i===ACT.i) s.className='cur'; segs.appendChild(s);
  }

  var wrap = $('blockWrap'); wrap.innerHTML='';

  var head = el('div','blockhead');
  head.appendChild(el('div','kicker', (ACT.i+1) + ' of ' + ACT.blocks.length));
  head.appendChild(el('h2', null, esc(b.t)));
  wrap.appendChild(head);

  if(b.rest) wrap.appendChild(el('div','restnote', esc(bwText(b.rest))));

  // A superset is alternated, so show it round by round rather than all of
  // one exercise then all of the next. Straight-set blocks stay as they were.
  var paired = /^Superset/i.test(b.t) && b.ex.length >= 2 &&
               b.ex.every(function(x){ return x.sets && x.sets.length; });

  if(paired){
    for(var e=0;e<b.ex.length;e++) wrap.appendChild(renderEx(b.ex[e], e, true));

    var rounds = 0;
    b.ex.forEach(function(x){ rounds = Math.max(rounds, x.sets.length); });

    for(var r=0;r<rounds;r++){
      var rd = el('div','round');
      rd.appendChild(el('div','roundhead', 'Round ' + (r+1)));
      b.ex.forEach(function(x){
        if(!x.sets[r]) return;
        rd.appendChild(el('div','rname', esc((x.c ? x.c + ' ' : '') + x.n)));
        rd.appendChild(renderSet(x, r, true));
      });
      wrap.appendChild(rd);
    }
  } else {
    for(var e2=0;e2<b.ex.length;e2++) wrap.appendChild(renderEx(b.ex[e2], e2));
  }

  $('btnPrev').style.visibility = ACT.i===0 ? 'hidden' : 'visible';
  $('btnNext').textContent = (ACT.i === ACT.blocks.length-1) ? 'Finish' : 'Next';
}

function renderEx(x, idx, noSets){
  var box = el('div','ex');
  if(x.c) box.appendChild(el('div','code', esc(x.c)));
  box.appendChild(el('h3', null, esc(x.n)));
  if(x.note) box.appendChild(el('div','note', esc(bwText(x.note))));

  if(x.v || x.alt){
    var row = el('div','vidrow');
    if(x.v){
      var a = el('a','vid','Demo'); a.href='https://www.youtube.com/watch?v='+x.v; a.target='_blank'; a.rel='noopener'; row.appendChild(a);
    }
    if(x.alt && x.alt.v){
      var a2 = el('a','vid', esc(x.alt.n)); a2.href='https://www.youtube.com/watch?v='+x.alt.v; a2.target='_blank'; a2.rel='noopener'; row.appendChild(a2);
    }
    box.appendChild(row);
  }

  if(!x.sets || !x.sets.length) return box;

  var kind = x.sets[0].k;
  var pb = bestFor(x.n, kind==='wr'?'wr':kind);
  if(pb!=null){
    var lbl = kind==='time' ? fmtTime(pb) : (kind==='wr' ? pb + ' ' + S.unit : pb + ' reps');
    box.appendChild(el('div','pb','Best &nbsp;<b>'+esc(lbl)+'</b>'));
  }

  if(noSets) return box;          // the set rows are shown per round instead

  var sets = el('div','sets');
  for(var i=0;i<x.sets.length;i++) sets.appendChild(renderSet(x, i));
  box.appendChild(sets);
  return box;
}

function setKey(x, i){ return (x.deltId || x.c || x.n) + '#' + i; }

function renderSet(x, i, inRound){
  var st = x.sets[i];
  var key = setKey(x, i);
  var rec = ACT.data[key] || {};
  var node = el('div','set' + (rec.done?' done':''));

  var top = el('div','top');
  top.appendChild(el('div','lab', inRound ? '' : esc(st.l)));
  top.appendChild(el('div','target', esc(bwText(st.t))));
  node.appendChild(top);

  var entry = el('div','entry');

  if(st.k === 'time'){
    var btn = el('button','timebtn');
    var secs = rec.sec != null ? rec.sec : 0;
    btn.innerHTML = '<span>'+fmtTime(secs)+'</span><small>'+(rec.done?'Tap to redo':'Tap to start')+'</small>';
    btn.dataset.key = key; btn.dataset.name = x.n;
    btn.addEventListener('click', function(){ toggleStopwatch(this); });
    entry.appendChild(btn);

  } else if(st.k === 'check'){
    var tick = el('button','donebtn', rec.done ? '&#10003; Completed' : 'Confirm completed');
    tick.addEventListener('click', function(){
      rec.done = !rec.done; commit(key, rec, x.n, st);
      node.classList.toggle('done', rec.done);
      tick.innerHTML = rec.done ? '&#10003; Completed' : 'Confirm completed';
      tick.classList.toggle('is-done', rec.done);
    });
    if(rec.done) tick.classList.add('is-done');
    entry.appendChild(tick);

  } else {
    if(st.k === 'wr'){
      entry.appendChild(numField(S.unit, rec.weight, function(v){ rec.weight=v; commit(key, rec, x.n, st); }));
    }
    entry.appendChild(numField('reps', rec.reps, function(v){ rec.reps=v; commit(key, rec, x.n, st); }));
    var tick2 = el('button','tick' + (rec.done?'':' off'), '&#10003;');
    tick2.addEventListener('click', function(){
      rec.done = !rec.done; commit(key, rec, x.n, st);
      node.classList.toggle('done', rec.done);
      tick2.innerHTML = '&#10003;';
    });
    entry.appendChild(tick2);
  }

  node.appendChild(entry);
  return node;
}

function numField(label, value, onChange){
  var f = el('div','field');
  f.appendChild(el('label', null, esc(label)));
  var inp = document.createElement('input');
  inp.type='number'; inp.inputMode='decimal'; inp.step='any';
  inp.value = (value==null ? '' : value);
  inp.addEventListener('input', function(){
    var v = inp.value==='' ? null : parseFloat(inp.value);
    onChange(isNaN(v) ? null : v);
  });
  f.appendChild(inp);
  return f;
}

function commit(key, rec, name, st){
  rec.n = name; rec.k = st.k; rec.label = st.l;
  ACT.data[key] = rec;

/* ---------- stopwatch ---------- */
var running = null;   // {key, started, btn}
function toggleStopwatch(btn){
  var key = btn.dataset.key;
  if(running && running.key === key){
    var sec = (Date.now() - running.started)/1000;
    var rec = ACT.data[key] || {};
    rec.sec = Math.round(sec*10)/10; rec.done = true;
    commit(key, rec, btn.dataset.name, {k:'time', l:''});
    btn.classList.remove('running');
    btn.innerHTML = '<span>'+fmtTime(rec.sec)+'</span><small>Tap to redo</small>';
    btn.closest('.set').classList.add('done');
    running = null;
    beep();
    var pbv = bestFor(btn.dataset.name, 'time');
    if(pbv!=null && rec.sec > pbv) toast('New best · ' + fmtTime(rec.sec));
    return;
  }
  if(running){ running.btn.classList.remove('running'); }
  running = { key:key, started:Date.now(), btn:btn };
  btn.classList.add('running');
  btn.closest('.set').classList.remove('done');
  keepAwake();
  tickStopwatch();
}
function tickStopwatch(){
  if(!running) return;
  var sec = (Date.now() - running.started)/1000;
  running.btn.innerHTML = '<span>'+fmtTime(sec)+'</span><small>Tap to stop</small>';
  setTimeout(tickStopwatch, 250);
}
function refreshRunningClocks(){ if(running) tickStopwatch(); }

/* ---------- rest overlay ---------- */
var restEnd=null, restTimer=null;
function startRest(sec, nextText){
  if(!sec){ return false; }
  restEnd = Date.now() + sec*1000;
  $('ovKicker').textContent = 'Rest';
  $('ovNext').textContent = nextText || '';
  $('overlay').classList.add('on');
  tickRest();
  return true;
}
function tickRest(){
  clearTimeout(restTimer);
  if(restEnd==null) return;
  var left = (restEnd - Date.now())/1000;
  var c = $('ovClock');
  c.textContent = fmtTime(Math.max(0,left));
  c.classList.toggle('zero', left<=0);
  if(left<=0 && !c.dataset.rung){ c.dataset.rung='1'; beep(); }
  if(left>0) delete c.dataset.rung;
  restTimer = setTimeout(tickRest, 250);
}
function endRest(){
  restEnd=null; clearTimeout(restTimer);
  delete $('ovClock').dataset.rung;
  $('overlay').classList.remove('on');
}
$('ovSkip').addEventListener('click', endRest);
$('ovAdd').addEventListener('click', function(){ if(restEnd) { restEnd += 30000; tickRest(); } });

/* ---------- navigation ---------- */
$('btnNext').addEventListener('click', function(){
  if(!ACT) return;
  var b = ACT.blocks[ACT.i];
  if(ACT.i === ACT.blocks.length-1){ finishSession(); return; }
  ACT.i++; save(K.act, ACT);
  renderBlock();
  var nb = ACT.blocks[ACT.i];
  if(b.restSec) startRest(b.restSec, 'Up next: ' + nb.t);
});
$('btnPrev').addEventListener('click', function(){
  if(!ACT || ACT.i===0) return;
  ACT.i--; save(K.act, ACT); renderBlock();
});
$('sessExit').addEventListener('click', function(){
  show('home'); renderHome();
  toast('Session kept — resume any time');
});
$('sessFinish').addEventListener('click', finishSession);

function finishSession(){
  if(!ACT) return;
  var entries = [];
  for(var k in ACT.data){
    var r = ACT.data[k];
    if(r && (r.done || r.sec!=null || r.reps!=null || r.weight!=null)) entries.push(r);
  }
  if(!entries.length){
    if(!confirm('Nothing logged. Discard this session?')) return;
    ACT=null; save(K.act,null); show('home'); renderHome(); return;
  }

  // delts logging
  var d = deltsToday();
  if(d){
    DLT.days[d.day] = DLT.days[d.day] || {};
    for(var k2 in ACT.data){
      var rr = ACT.data[k2];
      if(rr && rr.n && /ISO-Hold|Lateral Raise|Y-Hold/i.test(rr.n)){
        DLT.days[d.day][rr.n] = rr.sec!=null ? rr.sec : rr.reps;
      }
    }
    save(K.dlt, DLT);
  }

  var record = {
    id: Date.now(),
    date: new Date().toISOString(),
    programme: ACT.programme,
    name: prog().name,
    workout: ACT.workout,
    week: ACT.week,
    phase: ACT.phase,
    entries: entries
  };
  SES.push(record);
  save(K.ses, SES);
  queueUpload(record);      // local first, Sheet second

  // Advance the rotation only for a scheduled session. A workout picked by
  // hand is a one-off: it is logged as normal but leaves your place alone.
  if(!ACT.adhoc){
    var order = prog().order;
    var pos = order.indexOf(ACT.workout);
    var nextPos = (pos+1) % order.length;
    S.next = order[nextPos];
    if(nextPos === 0 && S.week < prog().weeks) S.week++;
    save(K.set, S);
  }
  var wasAdhoc = ACT.adhoc;

  ACT = null; save(K.act, null);
  endRest();
  show('home'); renderHome();
  toast(wasAdhoc ? 'Saved — your place is unchanged' : 'Session saved');
}

function deltsToday(){
  if(!DLT.start) return null;
  var start = new Date(DLT.start); start.setHours(0,0,0,0);
  var now = new Date(); now.setHours(0,0,0,0);
  var day = Math.floor((now - start)/86400000) + 1;
  if(day < 1 || day > DELTS.days) return null;
  var blk = DELTS.blocks.filter(function(b){ return day>=b.from && day<=b.to; })[0];
  // lifting day = a workout is planned today; treat every day the app is opened
  // to start a session as a lifting day. Default: lifting.
  var isLift = true;
  return { day:day, block:blk, isLift:isLift, work:blk.lift, rest:blk.rest };
}

      rec.results[t.id] = v; rec.date = new Date().toISOString();
      save(K.std, STD);

    }));

function scoreOf(t, v){
  if(v==null || isNaN(v)) return null;
  if(t.pct){
    if(!S.bodyweight) return null;
    return (v / S.bodyweight) * 100;
  }
  return v;
}
function gradeOf(t, v){
  var s = scoreOf(t, v);
  if(s==null) return {cls:'poor', label: t.pct && v!=null && !S.bodyweight ? 'Set your bodyweight to grade this' : 'Not recorded'};
  if(s >= t.elite) return {cls:'elite', label:'Lean Bastard Elite'};
  if(s >= t.lean)  return {cls:'lean',  label:'Lean Bastard'};
  return {cls:'poor', label:'Poor Bastard · keep going'};
}
function paintTiers(tiers, t, v){
  var s = scoreOf(t, v);
  var kids = tiers.children;
  for(var i=0;i<kids.length;i++) kids[i].classList.remove('hit');
  if(s==null) return;
  if(s >= t.elite) kids[2].classList.add('hit');
  else if(s >= t.lean) kids[1].classList.add('hit');
  else kids[0].classList.add('hit');
}

/* ==================================================================
   VIDEO LIBRARY
   Every demo in the programme, in one place, outside a session.
   ================================================================== */
function videoIndex(){
  var out = [], seen = {};

  function add(name, vid, where){
    if(!vid || seen[vid]) return;
    seen[vid] = true;
    out.push({ n:name, v:vid, w:where });
  }
  function walk(list, where){
    (list||[]).forEach(function(x){
      add(x.n, x.v, where);
      if(x.alt) add(x.alt.n, x.alt.v, where);
    });
  }

  var p = prog();
  p.phases.forEach(function(ph){
    walk(ph.warmup, ph.label + ' warm-up');
    p.order.forEach(function(L){
      (ph.workouts[L]||[]).forEach(function(b){
        walk(b.ex, ph.label + ' · Workout ' + L);
      });
    });
  });
  STANDARDS.forEach(function(t){ add(t.n, t.v, 'Standards'); });

  return out;
}

function renderVideos(filter){
  var w = $('videosWrap'); w.innerHTML='';
  var all = videoIndex();
  var q = (filter||'').trim().toLowerCase();

  var list = q ? all.filter(function(x){ return x.n.toLowerCase().indexOf(q) > -1; }) : all;

  if(!list.length){
    var e = el('div','empty');
    e.appendChild(el('h3',null,'Nothing matches'));
    e.appendChild(el('p',null,'Try a shorter word.'));
    w.appendChild(e); return;
  }

  if(q){
    // A search wants one flat list of hits, not the grouping.
    var head = el('div','vgroup');
    head.appendChild(el('div','kicker', list.length + ' result' + (list.length>1?'s':'')));
    head.appendChild(el('h2', null, 'Search'));
    w.appendChild(head);
    list.forEach(function(x){ w.appendChild(vrow(x, true)); });
    return;
  }

  var groups = [], byName = {};
  list.forEach(function(x){
    if(!byName[x.w]){ byName[x.w] = []; groups.push(x.w); }
    byName[x.w].push(x);
  });
  groups.forEach(function(g){
    var head = el('div','vgroup');
    head.appendChild(el('div','kicker', byName[g].length + ' videos'));
    head.appendChild(el('h2', null, esc(g)));
    w.appendChild(head);
    byName[g].forEach(function(x){ w.appendChild(vrow(x, false)); });
  });
}

function vrow(x, showWhere){
  var a = el('a','vrow');
  a.href = 'https://www.youtube.com/watch?v=' + x.v;
  a.target = '_blank'; a.rel = 'noopener';
  a.appendChild(el('div','play'));
  var mid = el('div','vn', esc(x.n));
  a.appendChild(mid);
  if(showWhere) a.appendChild(el('div','vw', esc(x.w)));

function exportCSV(){
  var rows = [['date','programme','workout','week','phase','exercise','set','weight','reps','seconds']];

  var csv = rows.map(function(r){
    return r.map(function(c){ var v=String(c==null?'':c); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',');
  }).join('\n');

  var a = document.createElement('a');

  var f4 = el('div','fieldrow');
  f4.appendChild(el('div','kicker','Next workout'));
  var sel2 = document.createElement('select');
  prog().order.forEach(function(L){
    var o=document.createElement('option'); o.value=L; o.textContent='Workout '+L; if(S.next===L) o.selected=true; sel2.appendChild(o);
  });
  sel2.addEventListener('change', function(){ S.next=sel2.value; save(K.set,S); renderHome(); });
  f4.appendChild(sel2);
  w.appendChild(f4);

  var f5 = el('div','fieldrow');
  f5.appendChild(el('div','kicker','Programme'));
  var sel3 = document.createElement('select');
  Object.keys(PROGRAMMES).forEach(function(id){
    var o=document.createElement('option'); o.value=id; o.textContent=PROGRAMMES[id].name; if(S.programme===id) o.selected=true; sel3.appendChild(o);
  });
  sel3.addEventListener('change', function(){
    S.programme=sel3.value; S.week=1; S.next=prog().order[0]; save(K.set,S); renderHome(); renderSettings();
  });
  f5.appendChild(sel3);
  w.appendChild(f5);

  // ---- Google Sheet sync ----
  var f6 = el('div','fieldrow');
  f6.appendChild(el('div','kicker','Google Sheet backup'));
  var i6 = document.createElement('input');
  i6.type='url'; i6.placeholder='Paste your /exec URL';
  i6.style.fontFamily='var(--body)'; i6.style.fontSize='14px'; i6.style.fontWeight='600';
  i6.value = S.syncUrl || '';
  i6.addEventListener('input', function(){
    S.syncUrl = i6.value.trim(); save(K.set,S); updateSyncLine(); flushOutbox();
  });
  f6.appendChild(i6);

  var i6b = document.createElement('input');
  i6b.type='text'; i6b.placeholder='Token (only if you set one in the script)';
  i6b.style.fontFamily='var(--body)'; i6b.style.fontSize='14px'; i6b.style.fontWeight='600';
  i6b.style.marginTop='8px';
  i6b.value = S.syncToken || '';
  i6b.addEventListener('input', function(){ S.syncToken = i6b.value.trim(); save(K.set,S); });
  f6.appendChild(i6b);

  var line = el('div','muted', syncStatus()); line.id='syncLine'; line.style.marginTop='10px';
  f6.appendChild(line);

  var syncActs = el('div','rowbtns'); syncActs.style.padding='14px 0 0';
  var rb = el('button','btn-ghost','Restore from Sheet');
  rb.addEventListener('click', function(){ restoreFromSheet(rb); });
  syncActs.appendChild(rb);
  var tb = el('button','btn-ghost','Send now');
  tb.addEventListener('click', function(){
    if(!OUT.length){ toast('Nothing waiting'); return; }
    flushOutbox(); toast('Sending...');
  });
  syncActs.appendChild(tb);
  f6.appendChild(syncActs);

  f6.appendChild(el('div','muted','Sessions upload on their own once you finish them. If there is no signal in the gym they queue here and go up next time you open the app. Restore pulls the whole history back on a new phone.'));
  w.appendChild(f6);

  var acts = el('div','rowbtns');
  var ex = el('button','btn-ghost','Export CSV'); ex.addEventListener('click', exportCSV); acts.appendChild(ex);
  var cl = el('button','btn-ghost','Clear all data');
  cl.addEventListener('click', function(){
    if(!confirm('Delete every session, standard and delt log on this phone? This cannot be undone.')) return;
    if(!confirm('Really sure? Export first if you want a copy.')) return;
    [K.set,K.act,K.ses,K.std,K.dlt,K.out].forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    location.reload();
  });
  acts.appendChild(cl);
  w.appendChild(acts);

  var info = el('div','fieldrow');
  info.appendChild(el('div','kicker','About'));
  info.appendChild(el('div','muted','Your log lives on this phone. Lock the screen, switch apps, come back whenever and your sets are still here. If you connect a Google Sheet above, finished sessions are copied there as a backup too.'));
  w.appendChild(info);
}

/* ==================================================================
   WIRING
   ================================================================== */
$('startBtn').addEventListener('click', function(){
  if(ACT){ syncDelts(); show('session'); renderBlock(); keepAwake(); return; }
  startSession(S.next);
});
$('toDelts').addEventListener('click', function(){ renderDelts(); show('delts'); });
$('toPick').addEventListener('click', function(){
  PICK = { week:S.week, letter:S.next }; renderPick(); show('pick');
});
$('toVideos').addEventListener('click', function(){
  $('vidSearch').value=''; renderVideos(''); show('videos');
});
$('vidSearch').addEventListener('input', function(){ renderVideos(this.value); });
$('toStandards').addEventListener('click', function(){ renderStandards(); show('standards'); });
$('toHistory').addEventListener('click', function(){ renderHistory(); show('history'); });
$('toSettings').addEventListener('click', function(){ renderSettings(); show('settings'); });
Array.prototype.forEach.call(document.querySelectorAll('[data-back]'), function(b){
  b.addEventListener('click', function(){ show('home'); renderHome(); });
});
$('deltsStrip').addEventListener('click', function(){ renderDelts(); show('delts'); });

renderHome();
flushOutbox();

/* service worker */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
