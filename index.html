<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Michael Fitness</title>
<meta name="theme-color" content="#FAFAF8">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Michael Fitness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   MICHAEL FITNESS · Marker
   Warm white, black 2px borders, square corners. Colour appears as a
   flat block behind the headline word and nowhere else. Gold = yours.
   Red = strength · Green = cardio · Purple = challenge · Lime = next.
   ================================================================== */
:root{
  color-scheme: light;
  --paper:#FAFAF8;
  --card:#FFFFFF;
  --ink:#141414;
  --mute:#6E6E6E;
  --line:#141414;
  --soft:#CFCFCF;
  --wash:#EFEFEC;
  --gold:#C9A227;
  --red:#D80027;
  --green:#1F9E3E;
  --purple:#5C00D8;
  --lime:#C4E200;
  --blue:#0052CC;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --disp:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --bw:2px;
}
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ height:100%; -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.4;
  overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent;
}
#app{ min-height:100vh; display:flex; flex-direction:column; padding-top:var(--safe-t); position:relative; overflow:hidden; }

/* ---------- views + transitions ---------- */
.view{ display:none; flex:1 1 auto; flex-direction:column; min-height:calc(100vh - var(--safe-t)); }
.view.on{ display:flex; animation:slideIn .22s cubic-bezier(.2,.7,.2,1) both; }
.view.on.back{ animation-name:slideBack; }
@keyframes slideIn{ from{ transform:translateX(28px); opacity:0 } to{ transform:none; opacity:1 } }
@keyframes slideBack{ from{ transform:translateX(-28px); opacity:0 } to{ transform:none; opacity:1 } }
@media (prefers-reduced-motion: reduce){ .view.on{ animation:none } *{ transition:none !important } }

.scroll{ flex:1 1 auto; padding-bottom:calc(var(--safe-b) + 24px); }

/* ---------- type ---------- */
h1,h2,h3{ margin:0; font-family:var(--disp); font-weight:900; letter-spacing:-.035em; line-height:.98; }
h1{ font-size:clamp(34px,9.5vw,44px); }
h2{ font-size:clamp(26px,7.5vw,34px); }
h3{ font-size:clamp(20px,5.5vw,24px); }
.k{ font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
.mute{ color:var(--mute); font-size:14px; font-weight:500; }

/* the marker: a flat colour block behind a headline */
.mk{ display:inline; padding:0 10px; color:#fff; line-height:1.22;
     font-family:var(--disp); font-weight:900; letter-spacing:-.035em; font-size:clamp(28px,8vw,36px);
     box-decoration-break:clone; -webkit-box-decoration-break:clone; }
.mk.red{ background:var(--red) } .mk.green{ background:var(--green) }
.mk.purple{ background:var(--purple) } .mk.gold{ background:var(--gold) }
.mk.ink{ background:var(--ink) } .mk.lime{ background:var(--lime); color:var(--ink) }
.mk.blue{ background:var(--blue) }

/* ---------- header ---------- */
.hd{ padding:22px 22px 12px; }
.hd .k{ margin-bottom:10px; }
.hd .sub{ margin-top:12px; margin-bottom:0; }
.topbar{ display:flex; align-items:center; gap:10px; padding:14px 14px 0; }
.topbar button{ font-family:var(--body); font-size:13px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  background:none; border:var(--bw) solid var(--soft); color:var(--mute); padding:9px 12px; cursor:pointer; }
.topbar button:active{ border-color:var(--ink); color:var(--ink); }
.topbar .sp{ flex:1; }
.wm{ font-family:var(--disp); font-weight:900; font-size:22px; letter-spacing:-.03em; padding-left:8px; }
.wm em{ font-style:normal; background:var(--gold); color:#fff; padding:0 6px; }

/* ---------- buttons ---------- */
button{ font-family:var(--body); font-size:16px; border:0; background:none; color:inherit; cursor:pointer; }
.t1stack{ display:flex; flex-direction:column; gap:12px; flex:1 1 auto; padding-bottom:calc(var(--safe-b) + 20px); }
#v-t1 .scroll{ display:flex; flex-direction:column; }
.big{
  display:flex; flex-direction:column; justify-content:space-between; width:100%; text-align:left; flex:1 1 0;
  border:var(--bw) solid var(--line); background:var(--card); padding:20px 20px 18px; min-height:170px;
  transition:transform .08s;
}
.big:active{ transform:scale(.985); }
.big .foot{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:28px; }
.big .foot .mk{ font-size:clamp(32px,9vw,40px); }
.big .foot .arr{ font-size:24px; font-weight:800; }
.resume{ display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; padding:16px 18px; background:var(--gold); color:var(--ink); }
.resume b{ font-family:var(--disp); font-weight:900; font-size:16px; letter-spacing:-.02em; display:block; }
.resume span{ display:block; font-size:12px; font-weight:600; margin-top:2px; opacity:.8; }

.rw{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:16px 18px; border:var(--bw) solid var(--line); background:var(--card); margin-bottom:10px;
  transition:transform .08s;
}
.rw:active{ transform:scale(.99); }
.rw .sq{ flex:0 0 44px; width:44px; height:44px; background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-weight:900; font-size:15px; }
.rw .tx{ flex:1; min-width:0; }
.rw b{ font-family:var(--disp); font-weight:800; font-size:18px; letter-spacing:-.02em; display:block; line-height:1.05; }
.rw span{ display:block; font-size:13px; color:var(--mute); margin-top:3px; font-weight:500; }
.rw .chip{ flex:0 0 auto; font-size:10px; font-weight:800; letter-spacing:.12em; padding:6px 9px; background:var(--gold); color:var(--ink); text-transform:uppercase; }
.rw.cur{ background:var(--ink); color:#fff; }
.rw.cur span{ color:#bbb; }
.rw.cur .sq{ background:var(--gold); color:var(--ink); }
.rw.sel{ background:var(--ink); color:#fff; }
.rw.sel span{ color:#bbb; }
.rw.sel .sq{ background:var(--purple); color:#fff; }
.rw.none{ color:var(--mute); border-color:var(--soft); }
.rw.none .sq{ background:var(--wash); color:#999; }
.rw.none.sel,.rw.none.cur{ background:var(--ink); color:#fff; border-color:var(--ink); }
.rw.none.sel .sq,.rw.none.cur .sq{ background:var(--gold); color:var(--ink); }
.rw.dim{ opacity:.5; }

.ghost{ border:var(--bw) solid var(--line); padding:12px 16px; font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; background:var(--card); }
.ghost:active{ background:var(--ink); color:#fff; }
.ghost.soft{ border-color:var(--soft); color:var(--mute); }

.pad{ padding:0 20px; }
.rows{ padding:8px 20px 0; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip2{ flex:1 1 56px; border:var(--bw) solid var(--line); background:var(--card); padding:12px 0; text-align:center;
  font-family:var(--disp); font-weight:900; font-size:20px; }
.chip2.on{ background:var(--ink); color:#fff; }
.chip2.on.gold{ background:var(--gold); color:var(--ink); }
.chip2.wide{ flex-basis:120px; font-size:14px; font-weight:800; letter-spacing:-.01em; padding:14px 6px; }

.daterow{ margin:0 0 12px; padding:12px 18px; border:var(--bw) solid var(--soft); background:var(--card); display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; }
.daterow.back{ border-color:var(--gold); background:#FBF4DE; }
.daterow.back .mute{ color:#8A6D0C; font-weight:700; }
.daterow .k{ grid-column:1; }
.daterow input[type=date]{ grid-column:2; grid-row:1 / span 2; justify-self:end; border:var(--bw) solid var(--line); background:var(--card); color:var(--ink);
  font-family:var(--disp); font-weight:800; font-size:16px; padding:9px 10px; border-radius:0; -webkit-appearance:none; min-width:150px; }
.daterow .mute{ grid-column:1; font-size:12px; }

/* ---------- bottom bar ---------- */
.barwrap{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--paper); border-top:var(--bw) solid var(--line); padding-bottom:var(--safe-b); }
.restbar{ display:flex; gap:8px; padding:10px 20px 0; }
.restbar .l{ flex:0 0 auto; align-self:center; font-size:10px; font-weight:800; letter-spacing:.14em; color:var(--mute); padding:0 2px; }
.restbar button{ flex:1; padding:11px; border:var(--bw) solid var(--line); background:var(--card); font-family:var(--disp); font-weight:800; font-size:15px; }
.restbar button:active{ background:var(--ink); color:#fff; }
.bar{ display:flex; gap:10px; padding:10px 20px 14px; }
.bar button{ flex:1; padding:17px; border:var(--bw) solid var(--line); background:var(--card); font-family:var(--disp); font-weight:800; font-size:16px; }
.bar .back{ flex:0 0 92px; color:var(--mute); border-color:var(--soft); }
.bar .go{ background:var(--ink); color:#fff; }
.bar .go.gold{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.bar .go.purple{ background:var(--purple); border-color:var(--purple); }
.bar .go.lime{ background:var(--lime); color:var(--ink); border-color:var(--lime); }
.bar .go:disabled{ background:var(--wash); color:#aaa; border-color:var(--wash); }
.bar button:active{ transform:scale(.985); }
.has-bar .scroll{ padding-bottom:calc(var(--barwrap-h,100px) + 20px); }

/* ---------- session ---------- */
.sesshead{ position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:var(--bw) solid var(--line); padding:12px 16px 10px; }
.sesshead .row{ display:flex; align-items:center; gap:12px; }
.sesshead .title{ flex:1; font-family:var(--disp); font-weight:800; font-size:17px; letter-spacing:-.02em; }
.xbtn{ width:40px; height:40px; font-size:26px; line-height:1; color:var(--mute); }
.endbtn{ font-size:12px; font-weight:800; letter-spacing:.1em; color:var(--mute); padding:0 4px; }
.segs{ display:flex; gap:3px; margin-top:10px; }
.segs i{ flex:1; height:5px; background:var(--wash); }
.segs i.done{ background:var(--ink); }
.segs i.cur{ background:var(--gold); }

.blockhead{ padding:20px 22px 2px; }
.blockhead .k{ color:var(--mute); }
.blockhead h2{ margin-top:8px; }
.restnote{ margin:12px 22px 0; padding:9px 12px; border-left:4px solid var(--ink); background:var(--wash); font-size:13px; font-weight:600; }

.ex{ padding:22px 22px 4px; border-top:var(--bw) solid var(--wash); margin-top:18px; }
.ex:first-of-type{ border-top:0; margin-top:0; }
.ex .code{ display:inline-block; background:var(--ink); color:#fff; font-family:var(--disp); font-weight:900; font-size:12px; padding:3px 8px; margin-bottom:8px; }
.ex .note{ margin-top:10px; font-size:14px; color:#333; line-height:1.4; border-left:3px solid var(--soft); padding-left:12px; }
.vidrow{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.vid{ display:inline-flex; align-items:center; gap:8px; border:var(--bw) solid var(--line); padding:8px 12px; font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); text-decoration:none; background:var(--card); }
.vid::before{ content:''; width:0; height:0; border-left:9px solid currentColor; border-top:6px solid transparent; border-bottom:6px solid transparent; }
.pb{ margin-top:10px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
.pb b{ color:var(--ink); }

.round{ padding:4px 22px 0; margin-top:24px; }
.roundhead{ font-family:var(--disp); font-weight:900; font-size:22px; letter-spacing:-.03em; border-bottom:var(--bw) solid var(--line); padding-bottom:6px; margin-bottom:12px; }
.rname{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--red); margin:0 0 6px; }

.sets{ margin-top:14px; }
.set{ border:var(--bw) solid var(--line); background:var(--card); margin-bottom:10px; }
.set .top{ display:flex; justify-content:space-between; gap:12px; padding:12px 14px 10px; }
.set .lab{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
.set .lab:empty{ display:none; }
.set .target{ font-size:13px; font-weight:600; color:var(--mute); text-align:right; }
.set .entry{ display:flex; gap:8px; padding:0 14px 12px; align-items:stretch; }
.field{ display:flex; align-items:center; border:var(--bw) solid var(--line); flex:1 1 0; min-width:0; background:var(--card); }
.field label{ font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:0 6px; color:var(--mute); flex:0 0 auto; max-width:42px; line-height:1.05; }
.field input{ flex:1 1 0; width:100%; min-width:0; border:0; background:transparent; color:inherit; font-family:var(--disp); font-weight:800; font-size:24px; padding:9px 6px 7px 0; text-align:center; -moz-appearance:textfield; }
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.field input:focus{ outline:3px solid var(--gold); outline-offset:1px; }
.tick{ flex:0 0 54px; min-height:46px; background:var(--wash); color:#aaa; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; }
.set.done{ background:var(--ink); color:#fff; }
.set.done .lab,.set.done .target{ color:#bbb; }
.set.done .field{ border-color:var(--gold); background:transparent; }
.set.done .field label{ color:#bbb; }
.set.done .field input{ color:var(--gold); }
.set.done .tick{ background:var(--gold); color:var(--ink); }
.donebtn{ width:100%; border:var(--bw) solid var(--line); padding:13px; font-family:var(--disp); font-weight:800; font-size:17px; background:var(--card); }
.set.done .donebtn{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
.timebtn{ width:100%; border:var(--bw) solid var(--line); padding:13px 14px; font-family:var(--disp); font-weight:900; font-size:30px; letter-spacing:-.02em; display:flex; align-items:center; justify-content:space-between; background:var(--card); }
.timebtn small{ font-family:var(--body); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.timebtn.running{ background:var(--purple); color:#fff; border-color:var(--purple); }
.timebtn.running small{ color:#fff; }
.set.done .timebtn{ background:transparent; color:var(--gold); border-color:var(--gold); }
.set.done .timebtn small{ color:#bbb; }

/* ---------- rest overlay ---------- */
.overlay{ position:fixed; inset:0; z-index:90; background:var(--purple); color:#fff; display:none; flex-direction:column; padding-top:var(--safe-t); }
.overlay.on{ display:flex; animation:riseIn .22s cubic-bezier(.2,.7,.2,1) both; }
@keyframes riseIn{ from{ transform:translateY(40px); opacity:0 } to{ transform:none; opacity:1 } }
.overlay .band{ height:30%; background:var(--red); display:flex; align-items:flex-end; padding:0 22px 16px; }
.overlay .band .k{ color:#fff; opacity:.9; }
.overlay .mid{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 22px; }
.overlay .clock{ font-family:var(--disp); font-weight:900; font-size:clamp(96px,36vw,160px); letter-spacing:-.06em; line-height:.85; }
.overlay .clock.zero{ color:var(--lime); }
.overlay .next{ margin-top:14px; font-size:15px; font-weight:700; opacity:.9; }
.overlay .acts{ display:flex; padding-bottom:var(--safe-b); }
.overlay .acts button{ flex:1; padding:22px; font-family:var(--disp); font-weight:800; font-size:16px; background:#4a00ad; color:#fff; }
.overlay .acts .primary{ background:#fff; color:var(--ink); }

/* ---------- grids (joner) ---------- */
.grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 20px 0; }
.tile{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-family:var(--disp); font-weight:900; font-size:26px; border:var(--bw) solid var(--line); background:var(--card); color:var(--soft); }
.tile.done{ background:var(--green); border-color:var(--green); color:#fff; }
.tile.next{ background:var(--lime); border-color:var(--lime); color:var(--ink); }
.tile.sel{ outline:4px solid var(--ink); outline-offset:-4px; color:var(--ink); }
.tile.done.sel{ color:#fff; outline-color:#fff; }

/* ---------- lists / history / settings ---------- */
.item{ padding:16px 22px; border-top:var(--bw) solid var(--wash); display:flex; gap:14px; align-items:baseline; }
.item .d{ font-family:var(--disp); font-weight:900; font-size:17px; min-width:72px; }
.item .b{ flex:1; }
.item .b .t{ font-weight:700; }
.item .b .s{ font-size:13px; color:var(--mute); }
.fieldrow{ padding:18px 22px; border-top:var(--bw) solid var(--wash); }
.fieldrow .k{ display:block; margin-bottom:8px; }
.fieldrow input,.fieldrow select{ width:100%; border:var(--bw) solid var(--line); padding:12px; font-family:var(--disp); font-weight:800; font-size:24px; background:var(--card); color:var(--ink); -moz-appearance:textfield; border-radius:0; }
.fieldrow input::-webkit-outer-spin-button,.fieldrow input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.fieldrow select{ font-size:18px; }
.fieldrow input.text{ font-family:var(--body); font-size:14px; font-weight:600; }
.rowbtns{ display:flex; gap:10px; padding:18px 22px; flex-wrap:wrap; }
.empty{ padding:40px 22px; text-align:center; color:var(--mute); }
.empty h3{ color:var(--ink); margin-bottom:10px; }
.test{ padding:18px 22px; border-top:var(--bw) solid var(--wash); }
.test .tiers{ display:flex; gap:6px; margin:12px 0 10px; }
.test .tiers div{ flex:1; padding:7px 4px; text-align:center; border:var(--bw) solid var(--wash); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; line-height:1.25; }
.test .tiers div b{ display:block; font-family:var(--disp); font-size:13px; }
.test .tiers div.hit{ background:var(--ink); color:#fff; border-color:var(--ink); }
.test .tiers div.hit.elite{ background:var(--gold); border-color:var(--gold); color:var(--ink); }
.grade{ font-family:var(--disp); font-weight:900; font-size:16px; margin-top:8px; text-transform:uppercase; letter-spacing:-.01em; }
.grade.poor{ color:var(--mute) } .grade.lean{ color:var(--ink) } .grade.elite{ color:var(--gold) }
.vrow{ display:flex; align-items:center; gap:14px; padding:14px 22px; border-top:var(--bw) solid var(--wash); color:var(--ink); text-decoration:none; }
.vrow .play{ flex:0 0 36px; height:36px; border:var(--bw) solid var(--line); display:flex; align-items:center; justify-content:center; }
.vrow .play::before{ content:''; width:0; height:0; border-left:11px solid var(--ink); border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:3px; }
.vrow .vn{ flex:1; font-weight:700; font-size:15px; }
.vrow .vw{ font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); }
.vgroup{ padding:22px 22px 4px; }
.vgroup .k{ color:var(--red); }

.toast{ position:fixed; left:50%; bottom:calc(var(--barwrap-h,0px) + var(--safe-b) + 18px); transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:#fff; padding:11px 18px; font-weight:800; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:120; white-space:nowrap; }
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<div id="app">

  <!-- ========== TIER 1 ========== -->
  <section class="view on" id="v-t1">
    <div class="scroll">
      <div class="topbar"><div class="wm">Michael <em>Fitness</em></div><div class="sp"></div><button id="toMore">More</button></div>
      <div class="hd"><div class="k" style="margin-top:10px;margin-bottom:0">What do you want to train?</div></div>
      <div class="pad"><div class="daterow" id="dateRow"><div class="k">Logging for</div><input type="date" id="logDate"><div class="mute" id="logDateLab">Today</div></div></div>
      <div class="pad t1stack">
        <button class="resume" id="resumeBtn" hidden></button>
        <button class="big" id="t1-strength"><div class="k">Programmes · Challenges</div><div class="foot"><span class="mk red">Strength</span><span class="arr">→</span></div></button>
        <button class="big" id="t1-cardio"><div class="k">Joner Soccer</div><div class="foot"><span class="mk green">Cardio</span><span class="arr">→</span></div></button>
      </div>
    </div>
  </section>

  <!-- ========== TIER 2 · programme / course ========== -->

function load(key, dflt){ try{ var r=localStorage.getItem(key); return r?JSON.parse(r):dflt; }catch(e){ return dflt; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ toast('Could not save'); return false; } }

S.unit      = S.unit || 'kg';

S.syncToken = S.syncToken || '';
if(S.autoRest === undefined) S.autoRest = true;
// migrate the old single-position fields into the per-programme map
if(S.week && !S.pos[S.programme]) S.pos[S.programme] = { week:S.week, next:S.next || 'A' };

var ACT = load(K.act, null);
var SES = load(K.ses, []);
var STD = load(K.std, []);
var CH  = load(K.chal, {});        // { delts:{start:iso, log:{day:{...}}}, sleeve:{...} }
var CD  = load(K.card, {});        // { joner:{ pft:{ 1:iso, 2:iso } } }
var OUT = load(K.out, []);

// migrate the old delts store if it exists
(function(){
  try{
    var old = JSON.parse(localStorage.getItem('mf.v1.delts') || 'null');
    if(old && old.start && !CH.delts){ CH.delts = { start:old.start, log:old.days || {} }; save(K.chal, CH); }

})();

/* ==================================================================

   ================================================================== */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var toastTimer;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); },1900); }
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
function shortDate(iso){ return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function today0(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
/* The date the current pick is being logged against. Defaults to today;
   the challenge screen lets you back-date a forgotten session. */
function pickDate(){ var iso = PICK ? PICK.date : LOGDATE; return iso ? new Date(iso+'T12:00:00') : new Date(); }
function pickDay0(){ var d=pickDate(); d.setHours(0,0,0,0); return d; }
function pickIso(){ return pickDate().toISOString(); }
function isoDay(d){ var z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10); }
function bwText(str){
  if(str==null) return '';
  return String(str).replace(/\{bw:(\d+(?:\.\d+)?)\}/g, function(_,pct){
    if(!S.bodyweight) return pct+'% BW';
    return (Math.round(S.bodyweight*(parseFloat(pct)/100)*2)/2)+' '+S.unit;
  });
}
function prog(id){ return PROGRAMMES[id || S.programme]; }
function wordFor(id){ var p=PROGRAMMES[id]; return (p&&p.wname)||'Workout'; }
function wlabel(L, id){ return wordFor(id)+' '+L; }
function phaseForWeek(p, wk){ for(var i=0;i<p.phases.length;i++){ if(wk>=p.phases[i].from&&wk<=p.phases[i].to) return p.phases[i]; } return p.phases[p.phases.length-1]; }
function posFor(id){ var p=PROGRAMMES[id]; return S.pos[id] || { week:1, next:p.order[0] }; }
function bestFor(name, kind){
  var best=null;
  SES.forEach(function(s){ (s.entries||[]).forEach(function(e){
    if(e.n!==name) return;
    var v = kind==='time'?e.sec : kind==='reps'?e.reps : e.weight;
    if(v!=null && (best==null||v>best)) best=v;
  }); });
  return best;
}

/* wake lock */
var wakeLock=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',function(){ wakeLock=null; }); } }catch(e){} }

function beep(){
  try{ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; var ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
    o.type='square'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+.01); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);
    o.start(); o.stop(ctx.currentTime+.5); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}

var STACK = ['t1'];
function show(id, isBack){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('on','back'); });
  var v=$('v-'+id); v.classList.add('on'); if(isBack) v.classList.add('back');
  window.scrollTo(0,0);
  if(!isBack && STACK[STACK.length-1]!==id) STACK.push(id);
  setTimeout(sizeBars, 0);
}
function goBack(){
  if(STACK.length<=1){ show('t1', true); return; }
  STACK.pop();
  var id = STACK[STACK.length-1];
  if(id==='t1') renderT1();
  show(id, true);
}
function home(){ STACK=['t1']; renderT1(); show('t1', true); }
document.querySelectorAll('[data-back]').forEach(function(b){ b.addEventListener('click', goBack); });
function sizeBars(){
  var v=document.querySelector('.view.on'); if(!v) return;

/* ---------- Tier 2 ---------- */
function renderT2(){
  var rows=$('t2-rows'); rows.innerHTML='';
  var h=$('t2-h'), k=$('t2-k');
  h.className='mk '+(PICK.kind==='strength'?'red':'green');
  var dateTag = PICK.date ? ' · for '+shortDate(pickIso()) : '';

  if(PICK.kind==='strength'){
    k.textContent='Strength'+dateTag; h.textContent='Which programme?';
    Object.keys(PROGRAMMES).forEach(function(id){
      var p=PROGRAMMES[id], pos=posFor(id), cur=id===S.programme;
      var b=el('button','rw'+(PICK.programme===id?' sel':''));
      b.innerHTML='<div class="sq">'+esc(p.short||p.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase())+'</div>'+
        '<div class="tx"><b>'+esc(p.name)+'</b><span>Week '+pos.week+' of '+p.weeks+' · '+esc(wlabel(pos.next,id))+' next</span></div>'+
        (cur?'<div class="chip">Current</div>':'');
      b.addEventListener('click', function(){ PICK.programme=id; renderT2(); });
      rows.appendChild(b);
    });
    var none=el('button','rw none'+(PICK.programme==='none'?' sel':''));
    none.innerHTML='<div class="sq">&mdash;</div><div class="tx"><b>None</b><span>Challenge only today</span></div>';
    none.addEventListener('click', function(){ PICK.programme='none'; renderT2(); });
    rows.appendChild(none);
  } else {
    k.textContent='Cardio'+dateTag; h.textContent='Which one?';
    Object.keys(CARDIO).forEach(function(id){
      var c=CARDIO[id];
      var b=el('button','rw'+(PICK.course&&PICK.course.split('.')[0]===id?' sel':''));
      var done=0; Object.keys(c.courses).forEach(function(cid){ done+=Object.keys((CD[id]||{})[cid]||{}).length; });
      b.innerHTML='<div class="sq">'+esc(c.name.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase())+'</div>'+
        '<div class="tx"><b>'+esc(c.name)+'</b><span>'+(done?done+' session'+(done>1?'s':'')+' logged':'Not started')+'</span></div>';
      b.addEventListener('click', function(){
        // one course for now: go straight to its grid
        var cid=Object.keys(c.courses)[0]; PICK.course=id+'.'+cid; renderJoner(); show('joner');
      });
      rows.appendChild(b);
    });
  }
  $('t2-go').disabled = PICK.kind==='strength' ? !PICK.programme : true;
  $('t2-go').style.display = PICK.kind==='strength' ? '' : 'none';
}
$('t2-go').addEventListener('click', function(){
  if(!PICK.programme) return;
  if(PICK.programme==='none'){ renderT3(); show('t3'); return; }
  var pos=posFor(PICK.programme); PICK.week=pos.week; PICK.day=pos.next;
  renderWeek(); show('wk');
});

/* ---------- week + day ---------- */
function renderWeek(){
  var p=prog(PICK.programme), pos=posFor(PICK.programme);
  if(PICK.week>p.weeks) PICK.week=1;
  if(p.order.indexOf(PICK.day)===-1) PICK.day=p.order[0];
  var ph=phaseForWeek(p, PICK.week);
  $('wk-k').textContent='Strength · '+p.name;
  var w=$('wk-wrap'); w.innerHTML='';

  var f1=el('div','fieldrow'); f1.appendChild(el('div','k','Phase'));
  var c1=el('div','chips');
  p.phases.forEach(function(x){ var b=el('button','chip2'+(x.n===ph.n?' on':''), String(x.n)); b.addEventListener('click',function(){ PICK.week=x.from; renderWeek(); }); c1.appendChild(b); });
  f1.appendChild(c1); f1.appendChild(el('div','mute', esc(ph.label))); w.appendChild(f1);

  var f2=el('div','fieldrow'); f2.appendChild(el('div','k','Week'));
  var c2=el('div','chips');
  for(var wk=ph.from; wk<=ph.to; wk++){ (function(n){ var b=el('button','chip2'+(n===PICK.week?' on':''), String(n)); b.addEventListener('click',function(){ PICK.week=n; renderWeek(); }); c2.appendChild(b); })(wk); }
  f2.appendChild(c2); w.appendChild(f2);

  var f3=el('div','fieldrow'); f3.appendChild(el('div','k', wordFor(PICK.programme)));
  var c3=el('div','chips');
  p.order.forEach(function(L){ var b=el('button','chip2'+(L===PICK.day?' on gold':''), L); b.addEventListener('click',function(){ PICK.day=L; renderWeek(); }); c3.appendChild(b); });
  f3.appendChild(c3); w.appendChild(f3);

  var isNext = PICK.week===pos.week && PICK.day===pos.next;
  var done=SES.filter(function(s){ return s.programme===PICK.programme && s.week===PICK.week && s.workout===PICK.day; }).length;
  var note=el('div','fieldrow');
  note.appendChild(el('div','k', isNext ? 'Up next in the programme' : 'Off schedule'));
  note.appendChild(el('div','mute', isNext
    ? 'Finishing this moves you on to the next one.'
    : (done ? 'You have logged this '+done+' time'+(done>1?'s':'')+'. Finishing it leaves your place alone.' : 'Not logged yet. Finishing it leaves your place alone.')));
  w.appendChild(note);
  PICK.adhoc = !isNext;
}
$('wk-go').addEventListener('click', function(){ renderT3(); show('t3'); });

/* ---------- joner grid ---------- */
function renderJoner(){
  var parts=PICK.course.split('.'), c=CARDIO[parts[0]], course=c.courses[parts[1]];
  var log=(CD[parts[0]]||{})[parts[1]]||{};
  $('jn-h').textContent=course.name;
  var g=$('jn-grid'); g.innerHTML='';
  var firstOpen=null;
  for(var i=1;i<=course.sessions;i++){ if(!log[i] && firstOpen==null) firstOpen=i; }
  if(PICK.session==null) PICK.session=firstOpen;
  for(var n=1;n<=course.sessions;n++){
    (function(n){
      var t=el('button','tile'+(log[n]?' done':'')+(n===firstOpen?' next':'')+(n===PICK.session?' sel':''), String(n));
      t.addEventListener('click', function(){ PICK.session=n; renderJoner(); });
      g.appendChild(t);
    })(n);
  }
  var doneN=Object.keys(log).length;
  $('jn-note').textContent = doneN+' of '+course.sessions+' done'+(PICK.session?(' · session '+PICK.session+(log[PICK.session]?' already logged '+shortDate(log[PICK.session]):' selected')):'');
  $('jn-go').textContent = PICK.session ? 'Continue' : 'Pick a session';
  $('jn-go').disabled = !PICK.session;
}
$('jn-go').addEventListener('click', function(){ if(PICK.session){ renderT3(); show('t3'); } });

/* ---------- Tier 3 ---------- */
function chalDay(id){
  var st=CH[id]; if(!st||!st.start) return null;
  var start=new Date(st.start); start.setHours(0,0,0,0);
  var d=Math.floor((pickDay0()-start)/86400000)+1;
  if(d<1||d>CHALLENGES[id].days) return null;
  return d;
}
function chalToday(id){
  var c=CHALLENGES[id], d=chalDay(id);
  if(d==null) return null;
  var isLift = PICK && PICK.kind==='strength' && PICK.programme && PICK.programme!=='none';
  var ids, label;
  if(c.byWeekday){ var r=c.byWeekday(pickDate().getDay()); ids=r.ids; label=r.label; }
  else { ids = isLift ? c.onLift(d) : c.onRest(d); label = isLift ? 'Lifting day' : 'Non-lifting day'; }
  ids = ids.filter(function(k){ var b=c.blocks[k]; return !b.only || b.only(d); });
  return { day:d, ids:ids, label:label };
}
function renderT3(){
  var k=$('t3-k');
  k.textContent = (PICK.kind==='cardio' ? 'Cardio · '+CARDIO[PICK.course.split('.')[0]].name
                : (PICK.programme==='none' ? 'Strength · no programme' : 'Strength · '+prog(PICK.programme).name))
                + (PICK.date ? ' · for '+shortDate(pickIso()) : '');
  var rows=$('t3-rows'); rows.innerHTML='';
  Object.keys(CHALLENGES).forEach(function(id){
    var c=CHALLENGES[id], t=chalToday(id), on=PICK.challenges.indexOf(id)>-1;
    var b=el('button','rw'+(on?' sel':'')+(t&&!t.ids.length?' dim':''));
    var sub = !t ? (CH[id]&&CH[id].start ? 'Finished' : 'Not started · tap to begin day 1 today')
            : 'Day '+t.day+' of '+c.days+' · '+t.label.toLowerCase();
    b.innerHTML='<div class="sq" style="background:var(--'+c.colour+');color:#fff">'+(t?t.day:'30')+'</div><div class="tx"><b>'+esc(c.name)+'</b><span>'+esc(sub)+'</span></div>'+(on?'<div class="chip">Today</div>':'');
    b.addEventListener('click', function(){
      if(!CH[id]||!CH[id].start){
        if(!confirm('Start '+c.name+' with '+(PICK.date?shortDate(pickIso()):'today')+' as day 1?')) return;
        CH[id]={ start:pickIso(), log:{} }; save(K.chal, CH);
      } else if(chalDay(id)==null){ toast(c.name+' is complete'); return; }
      var i=PICK.challenges.indexOf(id); if(i>-1) PICK.challenges.splice(i,1); else PICK.challenges.push(id);
      renderT3();
    });
    rows.appendChild(b);
  });
  var none=el('button','rw none'+(!PICK.challenges.length?' sel':''));
  none.innerHTML='<div class="sq">&mdash;</div><div class="tx"><b>None</b><span>'+(PICK.kind==='cardio'?'Just the session':(PICK.programme==='none'?'Nothing at all today':'Just the programme'))+'</span></div>';
  none.addEventListener('click', function(){ PICK.challenges=[]; renderT3(); });
  rows.appendChild(none);


  var go=$('t3-go');
  go.disabled = PICK.programme==='none' && !PICK.challenges.length;
  go.textContent = PICK.kind==='cardio' ? 'Log it' : 'Start';
}
$('t3-go').addEventListener('click', function(){
  if(PICK.kind==='cardio'){ renderJLog(); show('jlog'); return; }
  startSession();
});

/* ==================================================================
   SESSION
   ================================================================== */
function chalBlocks(id, pos){
  var c=CHALLENGES[id], t=chalToday(id); if(!t) return [];
  var out=[];
  t.ids.forEach(function(k){
    var b=c.blocks[k];
    var want = pos==='any' ? b.pos==='any' : b.pos===pos;
    if(!want) return;
    var sets=[];
    if(b.wr) sets.push({ l:'Load', t:'Dumbbell weight', k:'wr' });
    sets.push({ l:b.k==='time'?'Hold':'Reps', t:b.k==='time'?'As long as possible':'Total reps', k:b.k });
    out.push({ c:c.name.split(' ')[0].slice(0,3).toUpperCase(), n:b.n, note:b.t(t.day), sets:sets, chal:id, key:k });
  });
  return out;
}
function buildSession(){
  var blocks=[], p=null, ph=null;
  var hasProg = PICK.programme && PICK.programme!=='none';
  if(hasProg){ p=prog(PICK.programme); ph=phaseForWeek(p, PICK.week); }

  if(hasProg && ph.warmup && ph.warmup.length){
    blocks.push({ t:'Warm-up', rest:'Do this before every workout', restSec:0, warm:true,
      ex: ph.warmup.map(function(x){ return { c:x.c, n:x.n, v:x.v, note:x.note, sets:[{ l:'', t:(x.sets||[]).map(function(s){return s.t;}).join(' · '), k:'check' }] }; }) });
  }
  // challenge openers
  PICK.challenges.forEach(function(id){
    var ex=chalBlocks(id, 'start'); if(ex.length) blocks.push({ t:CHALLENGES[id].name+' · before you lift', rest:'', restSec:0, chal:true, ex:ex });
  });
  if(hasProg) (ph.workouts[PICK.day]||[]).forEach(function(b){ blocks.push(b); });
  // challenge closers + standalone blocks
  PICK.challenges.forEach(function(id){
    var ex=chalBlocks(id, 'end').concat(chalBlocks(id, 'any'));
    if(ex.length) blocks.push({ t:CHALLENGES[id].name+(hasProg?' · finisher':''), rest:'', restSec:0, chal:true, ex:ex });
  });
  return { kind:'strength', programme:hasProg?PICK.programme:null, workout:hasProg?PICK.day:null, week:hasProg?PICK.week:null,
           phase:hasProg?ph.n:null, adhoc:!!PICK.adhoc, challenges:PICK.challenges.slice(),
           startedAt:new Date().toISOString(), forDate:PICK.date||null, i:0, blocks:blocks, data:{} };
}
function startSession(){
  if(ACT && !confirm('You have a session in progress. Start this one instead and lose it?')) return;
  ACT=buildSession();
  if(!ACT.blocks.length){ toast('Nothing to do'); ACT=null; return; }
  save(K.act, ACT); keepAwake();
  STACK=['t1','session']; show('session'); renderBlock();
}

function isPaired(b){ return !!b && (b.pair===true || /^Superset/i.test(b.t)) && b.ex && b.ex.length>=2 && b.ex.every(function(x){ return x.sets&&x.sets.length; }); }
function restBetween(b){
  var s=b&&b.rest?String(b.rest):''; if(/no rest/i.test(s)) return 0;
  var m=s.match(/(\d+)(?:\s*-\s*\d+)?\s*sec between (?:exercises|legs)/i); return m?parseInt(m[1],10):null;
}
function renderBlock(){
  if(!ACT) return home();
  var b=ACT.blocks[ACT.i];
  var title = ACT.programme ? wlabel(ACT.workout, ACT.programme)+' · Wk '+ACT.week : 'Challenge';
  $('sessTitle').textContent=title;
  var segs=$('segs'); segs.innerHTML='';
  ACT.blocks.forEach(function(_,i){ var s=el('i'); if(i<ACT.i) s.className='done'; if(i===ACT.i) s.className='cur'; segs.appendChild(s); });
  var wrap=$('blockWrap'); wrap.innerHTML='';
  var head=el('div','blockhead'); head.appendChild(el('div','k',(ACT.i+1)+' of '+ACT.blocks.length));
  var h2=el('h2'); h2.innerHTML='<span class="mk '+(b.chal?'purple':b.warm?'ink':'red')+'" style="font-size:inherit">'+esc(b.t)+'</span>'; head.appendChild(h2);
  wrap.appendChild(head);
  if(b.rest) wrap.appendChild(el('div','restnote', esc(bwText(b.rest))));
  if(isPaired(b)){
    b.ex.forEach(function(x,i){ wrap.appendChild(renderEx(x,i,true)); });
    var rounds=0; b.ex.forEach(function(x){ rounds=Math.max(rounds,x.sets.length); });
    for(var r=0;r<rounds;r++){
      var rd=el('div','round'); rd.appendChild(el('div','roundhead','Round '+(r+1)));
      b.ex.forEach(function(x){ if(!x.sets[r]) return; rd.appendChild(el('div','rname', esc((x.c?x.c+' ':'')+x.n))); rd.appendChild(renderSet(x,r,true)); });
      wrap.appendChild(rd);
    }
  } else b.ex.forEach(function(x,i){ wrap.appendChild(renderEx(x,i)); });
  $('btnPrev').style.visibility = ACT.i===0?'hidden':'visible';
  $('btnNext').textContent = ACT.i===ACT.blocks.length-1 ? 'Finish' : 'Next';
  window.scrollTo(0,0); setTimeout(sizeBars,0);
}
function renderEx(x, idx, noSets){
  var box=el('div','ex');
  if(x.c) box.appendChild(el('div','code', esc(x.c)));
  box.appendChild(el('h3', null, esc(x.n)));
  if(x.note) box.appendChild(el('div','note', esc(bwText(x.note))));
  if(x.v||x.alt){
    var row=el('div','vidrow');
    if(x.v){ var a=el('a','vid','Demo'); a.href='https://www.youtube.com/watch?v='+x.v; a.target='_blank'; a.rel='noopener'; row.appendChild(a); }
    if(x.alt&&x.alt.v){ var a2=el('a','vid',esc(x.alt.n)); a2.href='https://www.youtube.com/watch?v='+x.alt.v; a2.target='_blank'; a2.rel='noopener'; row.appendChild(a2); }
    box.appendChild(row);
  }
  if(!x.sets||!x.sets.length) return box;
  var kind=x.sets[x.sets.length-1].k, pb=bestFor(x.n, kind==='wr'?'wr':kind);
  if(pb!=null) box.appendChild(el('div','pb','Best &nbsp;<b>'+esc(kind==='time'?fmtTime(pb):(kind==='wr'?pb+' '+S.unit:pb+' reps'))+'</b>'));
  if(noSets) return box;
  var sets=el('div','sets'); x.sets.forEach(function(_,i){ sets.appendChild(renderSet(x,i)); }); box.appendChild(sets);
  return box;
}
function setKey(x,i){ return (x.key||x.c||x.n)+'#'+i; }
function renderSet(x, i, inRound){
  var st=x.sets[i], key=setKey(x,i), rec=ACT.data[key]||{};
  var node=el('div','set'+(rec.done?' done':''));
  var top=el('div','top'); top.appendChild(el('div','lab', inRound?'':esc(st.l))); top.appendChild(el('div','target', esc(bwText(st.t)))); node.appendChild(top);
  var entry=el('div','entry');
  if(st.k==='time'){
    var btn=el('button','timebtn'); var secs=rec.sec!=null?rec.sec:0;
    btn.innerHTML='<span>'+fmtTime(secs)+'</span><small>'+(rec.done?'Tap to redo':'Tap to start')+'</small>';
    btn.dataset.key=key; btn.dataset.name=x.n; btn.dataset.idx=i;
    btn.addEventListener('click', function(){ toggleStopwatch(this, x); });
    entry.appendChild(btn);
  } else if(st.k==='check'){
    var tick=el('button','donebtn', rec.done?'&#10003; Completed':'Confirm completed');
    tick.addEventListener('click', function(){ rec.done=!rec.done; commit(key,rec,x.n,st); node.classList.toggle('done',rec.done); tick.innerHTML=rec.done?'&#10003; Completed':'Confirm completed'; if(rec.done) afterSetDone(x,i); });
    entry.appendChild(tick);
  } else {
    if(st.k==='wr') entry.appendChild(numField(S.unit, rec.weight, function(v){ rec.weight=v; commit(key,rec,x.n,st); }));
    if(st.k==='wr'||st.k==='reps') entry.appendChild(numField('reps', rec.reps, function(v){ rec.reps=v; commit(key,rec,x.n,st); }));
    var t2=el('button','tick','&#10003;');
    t2.addEventListener('click', function(){ rec.done=!rec.done; commit(key,rec,x.n,st); node.classList.toggle('done',rec.done); if(rec.done) afterSetDone(x,i); });
    entry.appendChild(t2);
  }
  node.appendChild(entry); return node;
}
function numField(label, value, onChange){
  var f=el('div','field'); f.appendChild(el('label',null,esc(label)));
  var inp=document.createElement('input'); inp.type='number'; inp.inputMode='decimal'; inp.step='any'; inp.value=value==null?'':value;
  inp.addEventListener('input', function(){ var v=inp.value===''?null:parseFloat(inp.value); onChange(isNaN(v)?null:v); });
  f.appendChild(inp); return f;
}
function commit(key, rec, name, st){ rec.n=name; rec.k=st.k; rec.label=st.l; ACT.data[key]=rec; save(K.act, ACT); }

/* stopwatch */
var running=null;
function toggleStopwatch(btn, x){
  var key=btn.dataset.key;
  if(running&&running.key===key){
    var rec=ACT.data[key]||{}; rec.sec=Math.round((Date.now()-running.started)/100)/10; rec.done=true;
    commit(key,rec,btn.dataset.name,{k:'time',l:''});
    btn.classList.remove('running'); btn.innerHTML='<span>'+fmtTime(rec.sec)+'</span><small>Tap to redo</small>';
    btn.closest('.set').classList.add('done'); running=null; beep();
    var pbv=bestFor(btn.dataset.name,'time'); if(pbv!=null&&rec.sec>pbv) toast('New best · '+fmtTime(rec.sec));
    if(x) afterSetDone(x, parseInt(btn.dataset.idx,10));
    return;
  }
  if(running) running.btn.classList.remove('running');
  running={ key:key, started:Date.now(), btn:btn }; btn.classList.add('running'); btn.closest('.set').classList.remove('done'); keepAwake(); tickStopwatch();
}
function tickStopwatch(){ if(!running) return; running.btn.innerHTML='<span>'+fmtTime((Date.now()-running.started)/1000)+'</span><small>Tap to stop</small>'; setTimeout(tickStopwatch,250); }

/* automatic rest */
function afterSetDone(x, i){
  if(!ACT||S.autoRest===false) return;
  var b=ACT.blocks[ACT.i]; if(!b||b.warm||b.chal) return;
  if(ACT.programme && (PROGRAMMES[ACT.programme]||{}).restMode==='manual') return;
  var idx=b.ex.indexOf(x); if(idx===-1) return;
  if(isPaired(b)){
    for(var j=idx+1;j<b.ex.length;j++){ if(b.ex[j].sets[i]){ var s=restBetween(b); return startRest(s==null?b.restSec:s, 'Next: '+(b.ex[j].c?b.ex[j].c+' ':'')+b.ex[j].n); } }
    if(b.ex.some(function(y){ return y.sets[i+1]; })) return startRest(b.restSec, 'Next: Round '+(i+2));
    return;
  }
  if(x.sets[i+1]) return startRest(b.restSec, 'Next: '+(x.sets[i+1].l||'next set'));
}

/* rest overlay */
var restEnd=null, restTimer=null;
function startRest(sec, nextText){
  if(!sec) return false;
  restEnd=Date.now()+sec*1000; $('ovKicker').textContent='Rest'; $('ovNext').textContent=nextText||'';
  $('overlay').classList.add('on'); tickRest(); return true;
}
function tickRest(){
  clearTimeout(restTimer); if(restEnd==null) return;
  var left=(restEnd-Date.now())/1000, c=$('ovClock');
  c.textContent=fmtTime(Math.max(0,left)); c.classList.toggle('zero',left<=0);
  if(left<=0&&!c.dataset.rung){ c.dataset.rung='1'; beep(); setTimeout(function(){ if(restEnd!=null&&Date.now()>=restEnd) endRest(); },1800); }
  if(left>0) delete c.dataset.rung;
  restTimer=setTimeout(tickRest,250);
}
function endRest(){ restEnd=null; clearTimeout(restTimer); delete $('ovClock').dataset.rung; $('overlay').classList.remove('on'); }
$('ovSkip').addEventListener('click', endRest);
$('ovAdd').addEventListener('click', function(){ if(restEnd){ restEnd+=30000; tickRest(); } });
$('overlay').addEventListener('click', function(e){ if(e.target===this) endRest(); });
document.querySelectorAll('.restbar [data-rest]').forEach(function(b){ b.addEventListener('click', function(){ startRest(parseInt(b.dataset.rest,10),''); keepAwake(); }); });

/* session nav */
$('btnNext').addEventListener('click', function(){
  if(!ACT) return; var b=ACT.blocks[ACT.i];
  if(ACT.i===ACT.blocks.length-1){ finishSession(); return; }
  ACT.i++; save(K.act,ACT); renderBlock();
  var manual = ACT.programme && (PROGRAMMES[ACT.programme]||{}).restMode==='manual';
  if(b.restSec && !manual && S.autoRest!==false && !b.chal) startRest(b.restSec, 'Up next: '+ACT.blocks[ACT.i].t);
});
$('btnPrev').addEventListener('click', function(){ if(!ACT||ACT.i===0) return; ACT.i--; save(K.act,ACT); renderBlock(); });
$('sessExit').addEventListener('click', function(){ home(); toast('Session kept'); });
$('sessFinish').addEventListener('click', finishSession);

function finishSession(){
  if(!ACT) return;
  var entries=[]; for(var k in ACT.data){ var r=ACT.data[k]; if(r&&(r.done||r.sec!=null||r.reps!=null||r.weight!=null)) entries.push(r); }
  if(!entries.length){ if(!confirm('Nothing logged. Discard this session?')) return; ACT=null; save(K.act,null); home(); return; }

  // challenge day logs (a resumed session may have no PICK, so stand one up from ACT)
  if(!PICK) PICK={ kind:'strength', programme:ACT.programme, challenges:ACT.challenges||[], date:ACT.forDate||null };
  else PICK.date = ACT.forDate||null;
  (ACT.challenges||[]).forEach(function(id){
    var d=chalDay(id); if(d==null) return;
    CH[id].log[d]=CH[id].log[d]||{};
    entries.forEach(function(e){ if(e.n) CH[id].log[d][e.n]= e.sec!=null?e.sec : e.reps!=null?e.reps : e.weight; });
  });
  save(K.chal, CH);

  var record={ id:Date.now(), date:ACT.forDate ? new Date(ACT.forDate+'T12:00:00').toISOString() : new Date().toISOString(), kind:'strength',
    programme:ACT.programme||'challenge', name:ACT.programme?prog(ACT.programme).name:(ACT.challenges||[]).map(function(c){return CHALLENGES[c].name;}).join(' + '),
    workout:ACT.workout||'', week:ACT.week||'', phase:ACT.phase||'', challenges:ACT.challenges||[], entries:entries };
  SES.push(record); save(K.ses,SES); queueUpload(record);

  if(ACT.programme && !ACT.adhoc){
    var p=prog(ACT.programme), pos=posFor(ACT.programme), i=p.order.indexOf(ACT.workout), ni=(i+1)%p.order.length;
    var nw=ACT.week; if(ni===0&&nw<p.weeks) nw++;
    S.pos[ACT.programme]={ week:nw, next:p.order[ni] }; S.programme=ACT.programme; save(K.set,S);
  }
  ACT=null; save(K.act,null); endRest(); LOGDATE=null; home(); toast('Session saved');
}

function renderJLog(){
  var parts=PICK.course.split('.'), c=CARDIO[parts[0]], course=c.courses[parts[1]];
  $('jl-h').textContent='Session '+PICK.session;
  var w=$('jl-wrap'); w.innerHTML='';

  w.appendChild(f);
  // challenge blocks that apply today get logged inline here
  PICK.challenges.forEach(function(id){
    var t=chalToday(id); if(!t) return;
    var ex=chalBlocks(id,'any').concat(chalBlocks(id,'start'), chalBlocks(id,'end'));
    if(!ex.length){ var r=el('div','fieldrow'); r.appendChild(el('div','k', CHALLENGES[id].name)); r.appendChild(el('div','mute','Rest day. Nothing to log.')); w.appendChild(r); return; }
    // reuse the session machinery with a throwaway ACT

  });
}
$('jl-go').addEventListener('click', function(){
  var parts=PICK.course.split('.'), c=CARDIO[parts[0]];
  CD[parts[0]]=CD[parts[0]]||{}; CD[parts[0]][parts[1]]=CD[parts[0]][parts[1]]||{};

  PICK.challenges.forEach(function(id){ var d=chalDay(id); if(d==null) return; CH[id].log[d]=CH[id].log[d]||{}; entries.forEach(function(e){ if(e.n) CH[id].log[d][e.n]=e.sec!=null?e.sec:e.reps!=null?e.reps:e.weight; }); });
  save(K.chal,CH);
  var record={ id:Date.now(), date:pickIso(), kind:'cardio', programme:parts[0]+'.'+parts[1], name:c.name+' · '+c.courses[parts[1]].name,

    entries:[{ n:'Session '+PICK.session, label:'Done', done:true }].concat(entries) };
  SES.push(record); save(K.ses,SES); queueUpload(record);
  ACT=null; save(K.act,null); LOGDATE=null; home(); toast('Session '+PICK.session+' logged');
});

/* ==================================================================
   GOOGLE SHEET SYNC — unchanged from before
   ================================================================== */
var syncing=false;
function queueUpload(session){ OUT.push(session); save(K.out,OUT); flushOutbox(); }
function flushOutbox(){
  if(syncing||!OUT.length||!S.syncUrl) return; syncing=true;
  var next=OUT[0];
  fetch(S.syncUrl,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ token:S.syncToken||'', session:next }) })
  .then(function(r){ return r.json(); })
  .then(function(res){ syncing=false; if(res&&res.ok){ OUT.shift(); save(K.out,OUT); updateSyncLine(); if(OUT.length) flushOutbox(); } else updateSyncLine(res&&res.error?res.error:'rejected'); })
  .catch(function(){ syncing=false; updateSyncLine(); });
}
function syncStatus(){ if(!S.syncUrl) return 'Not connected'; if(OUT.length) return OUT.length+' session'+(OUT.length>1?'s':'')+' waiting to upload'; return 'All sessions backed up'; }
function updateSyncLine(err){ var n=$('syncLine'); if(n) n.textContent=err?('Last attempt failed: '+err):syncStatus(); }
function restoreFromSheet(btn){
  if(!S.syncUrl){ toast('Add the Sheet URL first'); return; }
  btn.textContent='Restoring...';
  fetch(S.syncUrl+(S.syncUrl.indexOf('?')>-1?'&':'?')+'token='+encodeURIComponent(S.syncToken||''))
  .then(function(r){ return r.json(); })
  .then(function(res){
    if(!res||!res.ok) throw new Error('bad');
    var have={}; SES.forEach(function(s){ have[String(s.id)]=true; }); var added=0;
    (res.sessions||[]).forEach(function(s){ if(have[String(s.id)]) return; SES.push(s); added++; });
    SES.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); }); save(K.ses,SES);
    btn.textContent='Restore from Sheet'; toast(added?(added+' session'+(added>1?'s':'')+' restored'):'Nothing new to restore');
  }).catch(function(){ btn.textContent='Restore from Sheet'; toast('Could not reach the Sheet'); });
}

function renderMore(){
  $('historyMeta').textContent = SES.length ? SES.length+' session'+(SES.length>1?'s':'')+' logged' : 'No sessions yet';

}

function renderHistory(){
  var w=$('historyWrap'); w.innerHTML='';
  if(!SES.length){ var e=el('div','empty'); e.appendChild(el('h3',null,'Nothing logged yet')); w.appendChild(e); return; }
  for(var i=SES.length-1;i>=0;i--){ (function(s){
    var it=el('div','item'); it.appendChild(el('div','d', shortDate(s.date)));
    var b=el('div','b');
    var title = s.kind==='cardio' ? (s.name||'Cardio')+' · Session '+s.workout
              : (s.programme&&PROGRAMMES[s.programme] ? wlabel(s.workout,s.programme)+' · Week '+s.week+' · '+PROGRAMMES[s.programme].name : (s.name||'Challenge'));
    b.appendChild(el('div','t', esc(title)));
    var bits=(s.entries||[]).slice(0,4).map(function(e){ if(e.sec!=null) return e.n+' '+fmtTime(e.sec); if(e.weight!=null&&e.reps!=null) return e.n+' '+e.weight+'×'+e.reps; if(e.reps!=null) return e.n+' '+e.reps; return e.n; });
    b.appendChild(el('div','s', esc(bits.join(' · ')+((s.entries||[]).length>4?' …':''))));
    it.appendChild(b); w.appendChild(it);
  })(SES[i]); }
  var acts=el('div','rowbtns'); var ex=el('button','ghost','Export CSV'); ex.addEventListener('click',exportCSV); acts.appendChild(ex); w.appendChild(acts);
}
function exportCSV(){
  var rows=[['date','programme','workout','week','phase','exercise','set','weight','reps','seconds']];
  SES.forEach(function(s){ (s.entries||[]).forEach(function(e){ rows.push([s.date,s.name||s.programme,s.workout,s.week,s.phase,e.n,e.label||'',e.weight==null?'':e.weight,e.reps==null?'':e.reps,e.sec==null?'':e.sec]); }); });
  var csv=rows.map(function(r){ return r.map(function(c){ var v=String(c==null?'':c); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='michael-fitness-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}

function latestStd(){ return STD.length?STD[STD.length-1]:null; }
function scoreOf(t,v){ if(v==null||isNaN(v)) return null; if(t.pct){ if(!S.bodyweight) return null; return (v/S.bodyweight)*100; } return v; }
function gradeOf(t,v){ var s=scoreOf(t,v); if(s==null) return {cls:'poor',label:t.pct&&v!=null&&!S.bodyweight?'Set your bodyweight to grade this':'Not recorded'}; if(s>=t.elite) return {cls:'elite',label:'Lean Bastard Elite'}; if(s>=t.lean) return {cls:'lean',label:'Lean Bastard'}; return {cls:'poor',label:'Poor Bastard · keep going'}; }
function paintTiers(tiers,t,v){ var s=scoreOf(t,v), k=tiers.children; for(var i=0;i<k.length;i++) k[i].classList.remove('hit'); if(s==null) return; if(s>=t.elite) k[2].classList.add('hit'); else if(s>=t.lean) k[1].classList.add('hit'); else k[0].classList.add('hit'); }
function renderStandards(){
  var w=$('standardsWrap'); w.innerHTML=''; var last=latestStd()||{results:{}};
  w.appendChild(el('div','restnote','Record your results before week 1 of Lean Bastard, then retest at the end. Worth doing whichever programme you are on.'));
  STANDARDS.forEach(function(t){
    var box=el('div','test'); box.appendChild(el('h3',null,esc(t.n))); box.appendChild(el('div','note',esc(bwText(t.how))));
    if(t.v){ var row=el('div','vidrow'); var a=el('a','vid','Demo'); a.href='https://www.youtube.com/watch?v='+t.v; a.target='_blank'; a.rel='noopener'; row.appendChild(a); box.appendChild(row); }
    var val=last.results?last.results[t.id]:null; var tiers=el('div','tiers');
    ['Poor Bastard','Lean Bastard','Elite'].forEach(function(name,i){ var d=el('div',i===2?'elite':''); d.innerHTML='<b>'+esc(name)+'</b>'+esc(t.tiers[i]); tiers.appendChild(d); });
    box.appendChild(tiers);
    var entry=el('div','entry'); entry.style.padding='0';
    var grade=el('div','grade '+gradeOf(t,val).cls, gradeOf(t,val).label);
    entry.appendChild(numField(t.pct?S.unit:'secs', val, function(v){ var rec=latestStd(); if(!rec||rec.locked){ rec={date:new Date().toISOString(),results:{}}; STD.push(rec); } rec.results[t.id]=v; rec.date=new Date().toISOString(); save(K.std,STD); paintTiers(tiers,t,v); grade.className='grade '+gradeOf(t,v).cls; grade.textContent=gradeOf(t,v).label; }));
    box.appendChild(entry); box.appendChild(grade); paintTiers(tiers,t,val); w.appendChild(box);
  });
  var acts=el('div','rowbtns'); var nb=el('button','ghost','Start a new test date'); nb.addEventListener('click',function(){ var cur=latestStd(); if(cur) cur.locked=true; STD.push({date:new Date().toISOString(),results:{}}); save(K.std,STD); renderStandards(); toast('New test'); }); acts.appendChild(nb); w.appendChild(acts);
}

function videoIndex(){
  var out=[], seen={};
  function add(n,v,w){ if(!v||seen[v]) return; seen[v]=true; out.push({n:n,v:v,w:w}); }
  function walk(list,w){ (list||[]).forEach(function(x){ add(x.n,x.v,w); if(x.alt) add(x.alt.n,x.alt.v,w); }); }
  Object.keys(PROGRAMMES).forEach(function(id){ var p=PROGRAMMES[id]; p.phases.forEach(function(ph){ walk(ph.warmup,p.name+' · '+ph.label+' warm-up'); p.order.forEach(function(L){ (ph.workouts[L]||[]).forEach(function(b){ walk(b.ex,p.name+' · '+ph.label+' · '+wlabel(L,id)); }); }); }); });
  STANDARDS.forEach(function(t){ add(t.n,t.v,'Standards'); });
  return out;
}
function renderVideos(filter){
  var w=$('videosWrap'); w.innerHTML=''; var all=videoIndex(), q=(filter||'').trim().toLowerCase();
  var list=q?all.filter(function(x){ return x.n.toLowerCase().indexOf(q)>-1; }):all;
  if(!list.length){ var e=el('div','empty'); e.appendChild(el('h3',null,'Nothing matches')); w.appendChild(e); return; }
  if(q){ list.forEach(function(x){ w.appendChild(vrow(x,true)); }); return; }
  var groups=[], by={}; list.forEach(function(x){ if(!by[x.w]){ by[x.w]=[]; groups.push(x.w); } by[x.w].push(x); });
  groups.forEach(function(g){ var h=el('div','vgroup'); h.appendChild(el('div','k',esc(g))); w.appendChild(h); by[g].forEach(function(x){ w.appendChild(vrow(x,false)); }); });
}
function vrow(x,showWhere){ var a=el('a','vrow'); a.href='https://www.youtube.com/watch?v='+x.v; a.target='_blank'; a.rel='noopener'; a.appendChild(el('div','play')); a.appendChild(el('div','vn',esc(x.n))); if(showWhere) a.appendChild(el('div','vw',esc(x.w))); return a; }

function renderSettings(){
  var w=$('settingsWrap'); w.innerHTML='';
  var f1=el('div','fieldrow'); f1.appendChild(el('div','k','Bodyweight'));
  var i1=document.createElement('input'); i1.type='number'; i1.inputMode='decimal'; i1.value=S.bodyweight==null?'':S.bodyweight; i1.placeholder='0';
  i1.addEventListener('input',function(){ var v=parseFloat(i1.value); S.bodyweight=isNaN(v)?null:v; save(K.set,S); });
  f1.appendChild(i1); f1.appendChild(el('div','mute','Used for the percentage loads the programmes call for.')); w.appendChild(f1);

  var f2=el('div','fieldrow'); f2.appendChild(el('div','k','Unit'));
  var sel=document.createElement('select'); ['kg','lb'].forEach(function(u){ var o=document.createElement('option'); o.value=u; o.textContent=u; if(S.unit===u) o.selected=true; sel.appendChild(o); });
  sel.addEventListener('change',function(){ S.unit=sel.value; save(K.set,S); }); f2.appendChild(sel); w.appendChild(f2);

  var f3=el('div','fieldrow'); f3.appendChild(el('div','k','Automatic rest timer'));
  var c3=el('div','chips'); [['On',true],['Off',false]].forEach(function(p){ var on=(S.autoRest!==false)===p[1]; var b=el('button','chip2 wide'+(on?' on':''),p[0]); b.addEventListener('click',function(){ S.autoRest=p[1]; save(K.set,S); renderSettings(); }); c3.appendChild(b); });
  f3.appendChild(c3); f3.appendChild(el('div','mute','When on, finishing a set in Lean Bastard puts the clock up for the rest the programme asks for. Standardized Strength prescribes none, so it never fires there. The 30s / 60s / 2m buttons work either way.')); w.appendChild(f3);

  var f4=el('div','fieldrow'); f4.appendChild(el('div','k','Challenges'));
  Object.keys(CHALLENGES).forEach(function(id){
    var c=CHALLENGES[id], d=chalDay(id), st=CH[id];
    var line=el('div','mute', c.name+': '+(!st||!st.start?'not started':(d==null?'complete':'day '+d+' of '+c.days)));
    line.style.marginBottom='6px'; f4.appendChild(line);
    var row=el('div','chips'); row.style.marginBottom='12px';
    var rs=el('button','ghost soft', st&&st.start?'Restart':'Start today'); rs.addEventListener('click',function(){ if(st&&st.start&&!confirm('Restart '+c.name+' from today?')) return; CH[id]={start:new Date().toISOString(),log:{}}; save(K.chal,CH); renderSettings(); }); row.appendChild(rs);
    if(st&&st.start){ var cl=el('button','ghost soft','Clear'); cl.addEventListener('click',function(){ if(!confirm('Forget '+c.name+'?')) return; delete CH[id]; save(K.chal,CH); renderSettings(); }); row.appendChild(cl); }
    f4.appendChild(row);
  });
  w.appendChild(f4);

  var f5=el('div','fieldrow'); f5.appendChild(el('div','k','Google Sheet backup'));
  var i5=document.createElement('input'); i5.type='url'; i5.className='text'; i5.placeholder='Paste your /exec URL'; i5.value=S.syncUrl||'';
  i5.addEventListener('input',function(){ S.syncUrl=i5.value.trim(); save(K.set,S); updateSyncLine(); flushOutbox(); }); f5.appendChild(i5);
  var i5b=document.createElement('input'); i5b.type='text'; i5b.className='text'; i5b.placeholder='Token (only if set in the script)'; i5b.value=S.syncToken||''; i5b.style.marginTop='8px';
  i5b.addEventListener('input',function(){ S.syncToken=i5b.value.trim(); save(K.set,S); }); f5.appendChild(i5b);
  var line=el('div','mute',syncStatus()); line.id='syncLine'; line.style.marginTop='10px'; f5.appendChild(line);
  var sa=el('div','chips'); sa.style.marginTop='12px';
  var rb=el('button','ghost','Restore from Sheet'); rb.addEventListener('click',function(){ restoreFromSheet(rb); }); sa.appendChild(rb);
  var sn=el('button','ghost','Send now'); sn.addEventListener('click',function(){ if(!OUT.length){ toast('Nothing waiting'); return; } flushOutbox(); toast('Sending'); }); sa.appendChild(sn);
  f5.appendChild(sa); w.appendChild(f5);

  var acts=el('div','rowbtns');
  var ex=el('button','ghost','Export CSV'); ex.addEventListener('click',exportCSV); acts.appendChild(ex);
  var cl=el('button','ghost soft','Clear all data'); cl.addEventListener('click',function(){ if(!confirm('Delete everything on this phone? This cannot be undone.')) return; if(!confirm('Really sure? Export first if you want a copy.')) return; Object.keys(K).forEach(function(k){ try{ localStorage.removeItem(K[k]); }catch(e){} }); try{ localStorage.removeItem('mf.v1.delts'); }catch(e){} location.reload(); }); acts.appendChild(cl);
  w.appendChild(acts);
}
